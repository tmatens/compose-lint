# Docs site (issue #470): a build artifact of docs/*.md — the same files that
# feed `--explain` and the GitHub blob view. Never duplicate content here; the
# markdown stays front-matter-free because `--explain` prints it raw.
# mkdocs (not branch-mode Jekyll) because Jekyll's Liquid pass eats `{{ }}`
# inside code fences (CL-0004, CL-0019, hardening.md docker --format examples).
site_name: compose-lint
site_description: >-
  Security linter for Docker Compose files — 27 rules with actionable,
  runtime-proven fix guidance.
site_url: https://tmatens.github.io/compose-lint/
repo_url: https://github.com/tmatens/compose-lint
repo_name: tmatens/compose-lint
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Not built at all: the Docker Hub overview (a third copy of the README intro
# that exists only to be synced to Hub) and the dev.to/Hashnode cross-post
# drafts, which would otherwise publish self-canonical duplicates of
# state-of-compose.md under their own URLs.
exclude_docs: |
  dockerhub-overview.md
  publishing/

# Per-page <title> and meta description, derived from existing content
# (front matter is unavailable: --explain prints these files raw). The same
# hook marks every page outside the nav below `noindex` and drops it from the
# sitemap, so the curated nav is also the indexing surface.
hooks:
  - scripts/mkdocs_seo_hook.py
  # Sitemap <lastmod> per page, from git rather than the build date.
  - scripts/mkdocs_git_dates_hook.py

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  # Replaces fenced_code (SuperFences is a superset and must not run beside
  # it); the custom fence renders ```mermaid blocks as diagrams. It also parses
  # fences inside blockquotes, which fenced_code left as raw text.
  # Pygments stays off so code blocks keep the plain look they had.
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Curated nav: user-facing pages only. Everything else in docs/ (ADRs,
# CI/RELEASING internals) still builds and stays linkable, just unlisted —
# and, via the SEO hook, noindexed and absent from the sitemap. Maintainer
# docs that link outside docs/ (CI.md, MAINTAINING.md, SECURITY-EXPECTATIONS.md)
# are deliberately not in the nav. Adding a page here is what makes it
# indexable.
nav:
  - Home: index.md
  - Rules:
      - "CL-0001 Host control socket exposed": rules/CL-0001.md
      - "CL-0002 privileged: true — grants and replacement": rules/CL-0002.md
      - "CL-0003 no-new-privileges — privilege escalation": rules/CL-0003.md
      - "CL-0004 Unpinned image tags (:latest)": rules/CL-0004.md
      - "CL-0005 Ports published on 0.0.0.0": rules/CL-0005.md
      - "CL-0006 cap_drop — Operation not permitted to capabilities": rules/CL-0006.md
      - "CL-0007 read_only — Read-only file system errors": rules/CL-0007.md
      - "CL-0008 network_mode: host": rules/CL-0008.md
      - "CL-0009 Disabled seccomp / AppArmor profiles": rules/CL-0009.md
      - "CL-0010 Host PID and IPC namespaces": rules/CL-0010.md
      - "CL-0011 Strong host-adjacent capabilities": rules/CL-0011.md
      - "CL-0013 Sensitive host path exposed": rules/CL-0013.md
      - "CL-0014 Logging driver none": rules/CL-0014.md
      - "CL-0016 Dangerous host devices": rules/CL-0016.md
      - "CL-0017 Shared mount propagation": rules/CL-0017.md
      - "CL-0018 user: root and non-root permission fixes": rules/CL-0018.md
      - "CL-0019 Digest pinning (@sha256)": rules/CL-0019.md
      - "CL-0020 Credential-shaped env keys": rules/CL-0020.md
      - "CL-0021 Credentials in connection strings": rules/CL-0021.md
      - "CL-0022 tmpfs exec — running from tmpfs": rules/CL-0022.md
      - "CL-0024 Host-code-execution capabilities": rules/CL-0024.md
      - "CL-0025 Writable root-equivalent host mounts": rules/CL-0025.md
      - "CL-0026 Resource limits (memory/CPU)": rules/CL-0026.md
      - "CL-0027 Bounded-grant capabilities": rules/CL-0027.md
      - "CL-0028 Host-reaching capabilities": rules/CL-0028.md
      - "CL-0029 Host-availability capabilities": rules/CL-0029.md
      - "CL-0030 Host-disclosure capability": rules/CL-0030.md
  - Examples:
      - "Real-world examples": examples/index.md
      - "1 — Delete the service": examples/portainer-removed/index.md
      - "2 — Re-architect so the socket isn't needed": examples/logging-without-the-socket/index.md
      - "3 — Constrain it when the need is real": examples/netdata-socket-proxy/index.md
      - "4 — Suppress it, with the risk written down": examples/ci-runner-suppression/index.md
      - "Two rules in tension": examples/read-only-in-tension/index.md
      - "A true premise and a false conclusion": examples/read-only-multi-service/index.md
      - "The clean one": examples/clean-edge-proxy/index.md
  - Guides:
      - Configuration: configuration.md
      - "CLI reference": cli.md
      - "How it works": how-it-works.md
      - "What a run reads": what-a-run-reads.md
      - "Fixing findings": fix.md
      - "GitHub Action": github-action.md
      - "Forgejo Actions": forgejo.md
      - Severity levels: severity.md
      - Hardening walkthrough: hardening.md
      - Verifying releases: verifying.md
      - Compatibility: compatibility.md
  - Project:
      - Roadmap: ROADMAP.md
      - State of Docker Compose Security: state-of-compose.md
