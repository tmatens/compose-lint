services:
  block_vda:
    image: nginx:1.27-alpine
    devices:
      - /dev/vda:/dev/vda
  block_xvda:
    image: nginx:1.27-alpine
    devices:
      - /dev/xvda:/dev/xvda
  block_mmcblk:
    image: nginx:1.27-alpine
    devices:
      - /dev/mmcblk0:/dev/mmcblk0
  block_md:
    image: nginx:1.27-alpine
    devices:
      - /dev/md0:/dev/md0
  block_sda:
    image: nginx:1.27-alpine
    devices:
      - /dev/sda:/dev/sda
  block_sda1:
    image: nginx:1.27-alpine
    devices:
      - /dev/sda1:/dev/sda1
  block_nvme:
    image: nginx:1.27-alpine
    devices:
      - /dev/nvme0n1:/dev/nvme0n1
  disk_symlink:
    image: nginx:1.27-alpine
    devices:
      - /dev/disk/by-id/ata-drive:/dev/xvda
  multiple:
    image: nginx:1.27-alpine
    devices:
      - /dev/vda:/dev/vda
      - /dev/sda:/dev/sda
  dev_kmsg:
    image: nginx:1.27-alpine
    devices:
      - /dev/kmsg:/dev/kmsg
  capability_gated:
    image: nginx:1.27-alpine
    devices:
      - /dev/mem:/dev/mem
      - /dev/port:/dev/port
      - /dev/fuse:/dev/fuse
  unreachable_devices:
    image: nginx:1.27-alpine
    devices:
      - /dev/kmem:/dev/kmem
      - /dev/raw:/dev/raw
  safe_device:
    image: nginx:1.27-alpine
    devices:
      - /dev/net/tun:/dev/net/tun
  no_devices:
    image: nginx:1.27-alpine
