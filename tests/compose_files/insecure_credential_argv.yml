# CL-0020 argument-list surfaces (issue #1077): a credential literal in
# `command:`, `entrypoint:` or `healthcheck.test` reaches `docker inspect`
# and `/proc/<pid>/cmdline` as an env literal reaches `Config.Env`.
services:
  requirepass_list:
    image: redis:7.4.1
    command: ["redis-server", "--requirepass", "hunter2"]
  requirepass_string:
    image: redis:7.4.1
    command: redis-server --requirepass hunter2 --appendonly yes
  masterauth_inline:
    image: redis:7.4.1
    command: redis-server --masterauth=hunter2
  password_flag_entrypoint:
    image: app:1.0
    entrypoint: ["app", "--admin-password=admin"]
  assignment_in_shell_list:
    image: postgres:16.4
    command: ["sh", "-c", "PGPASSWORD=hunter2 psql -h db -c 'select 1'"]
  assignment_in_shell_string:
    image: postgres:16.4
    entrypoint: sh -c "PGPASSWORD=hunter2 psql -h db -c 'select 1'"
  mysql_glued_healthcheck:
    image: mysql:8.4
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-phunter2"]
  mysql_glued_cmd_shell:
    image: mariadb:11.4
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -phunter2 || exit 1"]
  healthcheck_string_form:
    image: clickhouse/clickhouse-server:24.8
    healthcheck:
      test: clickhouse-client --password hunter2 --query 'select 1'
  defaulted_reference:
    image: redis:7.4.1
    command: redis-server --requirepass ${REDIS_PASSWORD:-hunter2}
  numeric_value:
    image: redis:7.4.1
    command: ["redis-server", "--requirepass", 12345678]
  single_dash_long_flag:
    image: bitcoin/bitcoin:28.0
    command: bitcoind -rpcuser=bitcoin -rpcpassword=hunter2
  repeated_flag_once:
    image: app:1.0
    command: app --password hunter2 --password hunter3
  both_surfaces:
    image: redis:7.4.1
    environment:
      REDIS_PASSWORD: hunter2
    command: redis-server --requirepass hunter2
