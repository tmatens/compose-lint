- id: compose-lint
  name: compose-lint
  description: Docker Compose security linter (OWASP/CIS-grounded rules)
  entry: compose-lint
  # pre-commit runs `entry + args + filenames`, so a trailing `--` here is
  # what separates options from the paths it appends. Without it a
  # repository path like `--config=cfgdir/compose.yml` (a directory named
  # `--config=cfgdir`) is absorbed as a flag: the file leaves the lint set
  # and an attacker-authored policy is installed for the run.
  #
  # It lives in `args` rather than at the end of `entry` because a user's
  # own `args:` would land *after* an entry-level `--` and be read as
  # paths, breaking every config that passes flags. Setting `args:`
  # replaces this default, so a config that passes flags should end its
  # list with `--` (see README).
  args: [--]
  # Without this, pre-commit splits a long file list across parallel
  # processes, and each one sees only part of the project. A
  # `.compose-lint.yml` naming a service in another partition then reads as
  # stale, and `--strict-config` fails a valid config with exit 2. The linter
  # needs the whole list in one run, as the CLI and the Action get it.
  require_serial: true
  language: python
  # A Compose file committed as a symbolic link is a Compose file: Compose
  # follows it, and so does a bare `compose-lint` run. pre-commit tags a link
  # `symlink` and nothing else, not `file` and not `yaml`, and a hook's
  # `types` defaults to `[file]`, so `types_or` on its own still drops the
  # link. Emptying `types` is what lets it through; `files` below still
  # limits the hook to Compose file names.
  types: []
  types_or: [yaml, symlink]
  minimum_pre_commit_version: "2.9.0"
  # A separator must follow `compose`, so every real variant (compose.prod.yml,
  # compose-dev.yaml, compose_staging.yml, docker-compose.override.yml) is
  # selected but a YAML file that merely starts with those letters
  # (compose2.yml, composed.yml) is not handed to the linter, which rejects a
  # non-Compose file with exit 2 and fails the hook on every commit.
  files: (^|/)(docker-)?compose([._-][^/]*)?\.ya?ml$
  exclude: (^|/)\.?compose-lint\.ya?ml$
