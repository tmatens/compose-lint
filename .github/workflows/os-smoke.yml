name: OS smoke (macOS/Windows)

# The developer-machine legs (issue #572): the CLI and the pre-commit hook
# run predominantly on macOS and Windows laptops — the population that hit
# #465, on platforms the PR gate never touches. OS-specific risk lives in
# path handling (backslashes, drive letters), pre-commit's hook-environment
# build, and Windows console encodings.
#
# Promoted into the merge gate (issue #572's third acceptance criterion):
# `ci.yml` calls this workflow on PRs that touch code, and `ci-ok` gates on
# the result. The `workflow_call` trigger below is that entry point. The
# soak behind the promotion is narrow and worth stating plainly — the four
# failures were the rollout commits themselves (#584-#587, which is what
# the legs were for), and every run from `d757ee3` on has been green, but
# that is 9 runs inside a single day, not weeks of history. If Windows
# turns out to flake in the merge path, the honest fix is to quarantine
# the flaky leg here, not to widen `ci-ok`'s pass condition.
#
# The other triggers stay: the weekly cron catches drift that arrives with
# no PR at all — a yanked dependency, a resolver change, a runner-image
# update — which a merge gate structurally cannot see, and `push: main`
# keeps covering merges that bypassed the PR path.
#
# The pre-commit steps mirror ci.yml's `precommit-smoke` with one
# portability change: throwaway repos are created with `mktemp -d` under
# RUNNER_TEMP (converted to POSIX form via cygpath where that exists).
# The base directory matters on Windows: the workspace lives on D: while
# the default temp dir is on C:, and pre-commit's try-repo computes a
# relative path between the two — os.path.relpath cannot cross drives
# and crashes. Keeping the throwaway on the workspace drive avoids it.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "27 10 * * 1"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - pyproject.toml
      - "requirements*.lock"
      - .pre-commit-hooks.yaml
      - .github/workflows/os-smoke.yml

permissions: {}

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    # 3.11 is the `requires-python` floor and, until #613, the floor was tested only
    # on Linux — while the OS legs ran only 3.13. That left the realistic
    # worst case uncovered: an old Python on Windows. It is also the leg
    # most likely to differ, because what varies across these platforms is
    # `pathlib`/`os` behavior and that is exactly where the floor is
    # furthest from the version the ubuntu matrix's other legs pin.
    #
    # Deliberately the floor and the ceiling, not the full 3.11-3.14 range
    # the ubuntu matrix runs: the versions in between differ from their
    # neighbours far less than either end differs from the other, so they
    # would buy little for 6 more jobs on two of the slowest runners.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-build.lock
      - name: Install pinned dev env
        # The lockfiles are compiled with `--universal`, so the hash set
        # covers macOS/Windows wheels too.
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - run: pytest

  # Stays on one Python: what this leg exercises is pre-commit's
  # hook-environment build and the OS's path/console handling, neither of
  # which is a function of the interpreter version the way the pytest leg
  # is. It is also the slower of the two jobs — it builds an environment
  # per run — so doubling it buys the least and costs the most.
  precommit-smoke:
    name: pre-commit hook (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned dev env
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Clean stack with a config present should pass
        run: |
          set -euo pipefail
          TMPBASE="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          command -v cygpath >/dev/null 2>&1 && TMPBASE="$(cygpath -u "$TMPBASE")"
          SMOKE="$(mktemp -d -p "$TMPBASE")"
          cp tests/smoke/clean.yml "$SMOKE/docker-compose.yml"
          printf 'rules:\n  CL-0004:\n    enabled: false\n    reason: "smoke"\n' \
            > "$SMOKE/.compose-lint.yml"
          git -C "$SMOKE" init -q
          git -C "$SMOKE" add -A
          cd "$SMOKE"
          pre-commit try-repo "$GITHUB_WORKSPACE" compose-lint --all-files \
            --verbose 2>&1 | tee out.txt
          if grep -q "no files to check" out.txt; then
            echo "::error::Hook selected no files — the smoke test proved nothing."
            exit 1
          fi
          grep -q "docker-compose.yml" out.txt \
            || { echo "::error::Hook did not receive docker-compose.yml"; exit 1; }
          if grep -qE "appears to be a compose-lint config|could not be parsed" out.txt; then
            echo "::error::Hook passed its own config to the linter (issue #465)."
            exit 1
          fi

      - name: Insecure stack should fail the hook
        run: |
          set -euo pipefail
          TMPBASE="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          command -v cygpath >/dev/null 2>&1 && TMPBASE="$(cygpath -u "$TMPBASE")"
          SMOKE="$(mktemp -d -p "$TMPBASE")"
          cp tests/smoke/insecure.yml "$SMOKE/docker-compose.yml"
          git -C "$SMOKE" init -q
          git -C "$SMOKE" add -A
          cd "$SMOKE"
          if pre-commit try-repo "$GITHUB_WORKSPACE" compose-lint --all-files; then
            echo "::error::Expected the hook to fail on the insecure fixture."
            exit 1
          fi
