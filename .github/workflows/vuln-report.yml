name: Fixable vulnerability report

# Surfaces every vulnerability that has a fix available, at ANY severity,
# as a single rolling issue.
#
# Rationale: the blocking gates elsewhere are severity-scoped on purpose
# (ci.yml's dependency-review at `high`, scout-scan.yml's gate at
# `critical`) so a fixable low/medium never blocks unrelated work. That
# leaves a visibility gap: a fixable MEDIUM in the published image is
# real, actionable, and silent. This workflow closes the gap by
# *reporting* on fixability rather than severity, without changing what
# blocks.
#
# It also runs pip-audit with NO --ignore-vuln suppressions, so an
# advisory that is filtered out of the CI/release gates still shows up
# here. That is the anti-rot property: a suppression whose justification
# has gone stale is otherwise invisible to pip-audit (filtered by ID) and
# to Renovate (the existing pin is still satisfiable) simultaneously.
#
# It also checks the OpenVEX document is complete. Scanners match pip CVEs
# against the pip .dist-info the image keeps, so an advisory covering a pip
# version that any published tag retains is reported against that tag until
# a not_affected statement names it. Only `latest` is scanned, and it
# upgrades pip before stripping it, so an advisory published and fixed
# between two releases never reaches a scanner here (#1040). pip's advisory
# list from OSV is diffed against the statement names instead; a missing ID
# is a line in the rolling issue. No image is pulled for this.
#
# It also lists every GitHub Action this repository pins that has a published
# advisory, from zizmor's known-vulnerable-actions audit. ci.yml runs zizmor
# only when a workflow changes, and an advisory against a pin nobody touched
# arrives with time, not with a diff: v1.14.2 of the PyPI publish action sat
# under a critical advisory with every gate green until a release preflight
# ran zizmor by hand.
#
# It also asks for a decision on image findings that have no fix. The scan
# for fixable CVEs is `only-fixed`, so one with no fix reached nobody: it became
# a code-scanning alert and nothing else. A second scan without that filter,
# with the OpenVEX document applied, lists what the published image is still
# reported for. Each finding is fixable (already above), accepted as open in
# .vex/open-findings.json, or undecided. An undecided one becomes a line in
# the rolling issue once it has gone 14 days from publication without a fix,
# and only when scout-scan.yml's alerts report it too: most are fixed by a
# base image update first, and Scout's advisory data changes between scans.
# An accepted entry that both scans have dropped is reported as stale.

on:
  workflow_dispatch:
  schedule:
    # 30 min after scout-scan.yml's 06:00 sweep, so the image scan below
    # sees the same day's advisory data.
    - cron: "30 6 * * *"

permissions: {}

jobs:
  report:
    name: Report fixable vulnerabilities
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      # Read scout-scan.yml's open alerts, the second scan the image
      # findings check compares with.
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned env
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .

      # No --ignore-vuln flags: this report is the un-suppressed view.
      # continue-on-error because pip-audit exits non-zero when it finds
      # anything, which is the normal case we want to report on — the
      # report script fails the job if the JSON is missing or malformed.
      - name: pip-audit (no suppressions)
        continue-on-error: true
        run: pip-audit --skip-editable --format json --output pip-audit.json

      # Online, because known-vulnerable-actions queries GitHub's advisory
      # database and does not run offline. With no token zizmor falls back
      # to offline mode and says so only as a warning, which would render as
      # "None" here: the grep makes that a failure. --no-exit-codes because
      # a finding is the normal case to report; a real error still exits 1.
      - name: zizmor known-vulnerable-actions (online)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zizmor --no-progress --no-exit-codes --format json .github/ action.yml \
            > zizmor.json 2> zizmor.err || { cat zizmor.err >&2; exit 1; }
          cat zizmor.err >&2
          if grep -qi 'offline mode' zizmor.err; then
            echo "::error::zizmor ran offline, so known-vulnerable-actions did not run"
            exit 1
          fi

      # Read-only PAT: this job pulls and scans, never pushes. The write
      # token is referenced only by the jobs that push or sync.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}

      # docker/scout-action downloads its CLI anonymously, and a spent
      # anonymous rate limit on the runner's IP answers 403 before any
      # scan runs. Fetch it with the job token first; see the action.
      - name: Pre-seed the Scout CLI
        uses: $/.github/actions/preseed-scout-cli

      - name: Scan published image for fixable CVEs (all severities)
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: cves
          image: composelint/compose-lint:latest
          # Fixability is the filter — deliberately no `only-severities`.
          only-fixed: true
          exit-code: false
          sarif-file: scout-fixable.sarif
          # Same OpenVEX document the image attestation carries, so CVEs
          # already marked not_affected don't page. See scout-scan.yml
          # for why vex-author must be `.*`.
          vex-location: .vex/compose-lint.openvex.json
          vex-author: .*

      # Same image, same document, no `only-fixed`: everything the image is
      # still reported for once the not_affected statements are applied.
      - name: Scan published image for every remaining CVE
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: cves
          image: composelint/compose-lint:latest
          exit-code: false
          sarif-file: scout-all.sarif
          vex-location: .vex/compose-lint.openvex.json
          vex-author: .*

      # The alerts scout-scan.yml uploaded for the default branch, by rule
      # id. An empty list is a valid answer and still writes the file; an
      # API error fails the step.
      - name: Fetch the scheduled Scout scan's open alerts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GH_REPO}/code-scanning/alerts?ref=refs/heads/main&state=open&tool_name=Docker%20Scout&per_page=100" \
            --jq '.[] | select(.most_recent_instance.category == "docker-scout-scheduled") | .rule.id' \
            > scout-alert-ids.txt
          jq -R . scout-alert-ids.txt | jq -s '{rule_ids: .}' > scout-alerts.json

      # Publication date of each CVE the scan above reports, for the 14-day
      # rule. OSV's Debian record is tried first because it exists for CVEs
      # the plain CVE record does not yet; 404 on both leaves no file, which
      # the report script reads as an unknown age and treats as old. Any
      # other status fails the step. The id comes from the scanner's output,
      # so it is checked before it goes into a URL.
      - name: Fetch publication dates from OSV
        run: |
          set -euo pipefail
          mkdir osv-image
          jq -r '[.runs[] | (.results // [])[] | .ruleId] | unique | .[]' \
            scout-all.sarif > image-ids.txt
          while IFS= read -r id; do
            if ! [[ "${id}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{3,63}$ ]]; then
              echo "::error::unexpected vulnerability id in the Scout SARIF"
              exit 1
            fi
            for record in "DEBIAN-${id}" "${id}"; do
              code=$(curl --silent --show-error \
                --retry 5 --retry-all-errors --max-time 60 \
                --output osv-record.json --write-out '%{http_code}' \
                "https://api.osv.dev/v1/vulns/${record}")
              if [ "${code}" = 200 ]; then
                mv osv-record.json "osv-image/${id}.json"
                break
              elif [ "${code}" != 404 ]; then
                echo "::error::OSV answered ${code} for ${record}"
                exit 1
              fi
            done
          done < image-ids.txt

      # One page holds every pip advisory with room to spare (the API pages
      # at 1000); the report script refuses a response that carries a
      # next_page_token rather than compare against a partial list, and
      # refuses an empty list, since a query returning nothing for pip is a
      # broken query, not a clean one.
      #
      # No --retry-delay: without it curl backs off exponentially between
      # retries (1s, 2s, 4s, ...); setting it pins every wait to that value.
      - name: Fetch pip's advisory list from OSV
        run: |
          curl --silent --show-error --fail \
            --retry 5 --retry-all-errors --max-time 60 \
            --header 'Content-Type: application/json' \
            --data '{"package": {"name": "pip", "ecosystem": "PyPI"}}' \
            --output osv-pip.json \
            https://api.osv.dev/v1/query

      # --pip-floor: advisories whose every fix is at or below this pip are
      # out of scope, because no published image retains a pip that old.
      # Tags before the always-latest pip upgrade kept the Debian 13
      # python3-pip the venv was seeded from (25.1.x), so 25.1 is just under
      # the oldest pip any tag can report. Lowering it only adds historical
      # advisories that would each need a true-but-pointless statement.
      - name: Build report body
        id: build
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/vuln_report.py \
            --pip-audit pip-audit.json \
            --scout-sarif scout-fixable.sarif \
            --image composelint/compose-lint:latest \
            --vex .vex/compose-lint.openvex.json \
            --osv osv-pip.json \
            --osv-package pip \
            --pip-floor 25.1 \
            --zizmor zizmor.json \
            --scout-all-sarif scout-all.sarif \
            --open-findings .vex/open-findings.json \
            --scout-alerts scout-alerts.json \
            --published-dir osv-image \
            --min-age-days 14 \
            --run-url "${RUN_URL}" \
            --out body.md

      # Rolling issue: one issue, rewritten in place, closed when clean.
      # An OPEN issue with this label means "there is something fixable, an
      # OpenVEX statement to write, or an image finding to decide, right
      # now" — there is no triage backlog to maintain.
      - name: Reconcile rolling issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COUNT: ${{ steps.build.outputs.count }}
          TITLE: ${{ steps.build.outputs.title }}
          HAS_FINDINGS: ${{ steps.build.outputs.has_findings }}
          LABEL: fixable-vulns
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          gh label create "${LABEL}" \
            --description "Rolling report: vulnerabilities with an available fix" \
            --color B60205 --force

          existing=$(gh issue list --state open --label "${LABEL}" \
            --json number --jq '.[0].number // empty')

          if [ "${HAS_FINDINGS}" = "true" ]; then
            if [ -n "${existing}" ]; then
              echo "Updating issue #${existing}: ${TITLE}"
              gh issue edit "${existing}" --title "${TITLE}" --body-file body.md
            else
              echo "Opening new issue: ${TITLE}"
              gh issue create --title "${TITLE}" --body-file body.md \
                --label "${LABEL}"
            fi
          elif [ -n "${existing}" ]; then
            echo "Nothing fixable, no OpenVEX gap and no image finding to decide; closing #${existing}"
            gh issue close "${existing}" --reason completed --comment \
              "All previously reported vulnerabilities are resolved or have no available fix, the OpenVEX document names every in-scope pip advisory, and every image finding with no fix has a statement or an accepted entry. Verified by ${RUN_URL}."
          else
            echo "No fixable vulnerabilities and no open issue. Nothing to do."
          fi

      - name: Report scheduled failure as issue
        if: failure() && github.event_name == 'schedule'
        uses: $/.github/actions/report-scheduled-failure
        with:
          note: The vulnerability report did not complete, so the rolling issue may be stale.
