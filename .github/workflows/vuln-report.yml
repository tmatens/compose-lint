name: Fixable vulnerability report

# Surfaces every vulnerability that has a fix available, at ANY severity,
# as a single rolling issue.
#
# Rationale: the blocking gates elsewhere are severity-scoped on purpose
# (ci.yml's dependency-review at `high`, scout-scan.yml's gate at
# `critical`) so a fixable low/medium never blocks unrelated work. That
# leaves a visibility gap: a fixable MEDIUM in the published image is
# real, actionable, and silent. This workflow closes the gap by
# *reporting* on fixability rather than severity, without changing what
# blocks.
#
# It also runs pip-audit with NO --ignore-vuln suppressions, so an
# advisory that is filtered out of the CI/release gates still shows up
# here. That is the anti-rot property: a suppression whose justification
# has gone stale is otherwise invisible to pip-audit (filtered by ID) and
# to Renovate (the existing pin is still satisfiable) simultaneously.
#
# It also checks the OpenVEX document is complete. Scanners match pip CVEs
# against the pip .dist-info the image keeps, so an advisory covering a pip
# version that any published tag retains is reported against that tag until
# a not_affected statement names it. Only `latest` is scanned, and it
# upgrades pip before stripping it, so an advisory published and fixed
# between two releases never reaches a scanner here (#1040). pip's advisory
# list from OSV is diffed against the statement names instead; a missing ID
# is a line in the rolling issue. No image is pulled for this.

on:
  workflow_dispatch:
  schedule:
    # 30 min after scout-scan.yml's 06:00 sweep, so the image scan below
    # sees the same day's advisory data.
    - cron: "30 6 * * *"

permissions: {}

jobs:
  report:
    name: Report fixable vulnerabilities
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned env
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      # No --ignore-vuln flags: this report is the un-suppressed view.
      # continue-on-error because pip-audit exits non-zero when it finds
      # anything, which is the normal case we want to report on — the
      # report script fails the job if the JSON is missing or malformed.
      - name: pip-audit (no suppressions)
        continue-on-error: true
        run: pip-audit --skip-editable --format json --output pip-audit.json

      # Read-only PAT: this job pulls and scans, never pushes. The write
      # token is referenced only by the jobs that push or sync.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}

      # `continue-on-error` + the retry below absorb a transient 403 on
      # the Scout CLI download, which is not retried by the action (see
      # scout-scan.yml for the full note). This scan is `exit-code:
      # false`, so a failure here is always an infra error, never a
      # finding — and `Build report body` hard-fails on a missing SARIF,
      # so letting one through would surface as a confusing parse error.
      - name: Scan published image for fixable CVEs (all severities)
        id: scan
        continue-on-error: true
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: cves
          image: composelint/compose-lint:latest
          # Fixability is the filter — deliberately no `only-severities`.
          only-fixed: true
          exit-code: false
          sarif-file: scout-fixable.sarif
          # Same OpenVEX document the image attestation carries, so CVEs
          # already marked not_affected don't page. See scout-scan.yml
          # for why vex-author must be `.*`.
          vex-location: .vex/compose-lint.openvex.json
          vex-author: .*

      - name: Retry scan after a failed Scout CLI download
        if: steps.scan.outcome == 'failure'
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: cves
          image: composelint/compose-lint:latest
          only-fixed: true
          exit-code: false
          sarif-file: scout-fixable.sarif
          vex-location: .vex/compose-lint.openvex.json
          vex-author: .*

      # One page holds every pip advisory with room to spare (the API pages
      # at 1000); the report script refuses a response that carries a
      # next_page_token rather than compare against a partial list, and
      # refuses an empty list, since a query returning nothing for pip is a
      # broken query, not a clean one.
      - name: Fetch pip's advisory list from OSV
        run: |
          curl --silent --show-error --fail \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 \
            --header 'Content-Type: application/json' \
            --data '{"package": {"name": "pip", "ecosystem": "PyPI"}}' \
            --output osv-pip.json \
            https://api.osv.dev/v1/query

      # --pip-floor: advisories whose every fix is at or below this pip are
      # out of scope, because no published image retains a pip that old.
      # Tags before the always-latest pip upgrade kept the Debian 13
      # python3-pip the venv was seeded from (25.1.x), so 25.1 is just under
      # the oldest pip any tag can report. Lowering it only adds historical
      # advisories that would each need a true-but-pointless statement.
      - name: Build report body
        id: build
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/vuln_report.py \
            --pip-audit pip-audit.json \
            --scout-sarif scout-fixable.sarif \
            --image composelint/compose-lint:latest \
            --vex .vex/compose-lint.openvex.json \
            --osv osv-pip.json \
            --osv-package pip \
            --pip-floor 25.1 \
            --run-url "${RUN_URL}" \
            --out body.md

      # Rolling issue: one issue, rewritten in place, closed when clean.
      # An OPEN issue with this label means "there is something fixable, or
      # an OpenVEX statement to write, right now" — there is no triage
      # backlog to maintain.
      - name: Reconcile rolling issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COUNT: ${{ steps.build.outputs.count }}
          TITLE: ${{ steps.build.outputs.title }}
          HAS_FINDINGS: ${{ steps.build.outputs.has_findings }}
          LABEL: fixable-vulns
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          gh label create "${LABEL}" \
            --description "Rolling report: vulnerabilities with an available fix" \
            --color B60205 --force

          existing=$(gh issue list --state open --label "${LABEL}" \
            --json number --jq '.[0].number // empty')

          if [ "${HAS_FINDINGS}" = "true" ]; then
            if [ -n "${existing}" ]; then
              echo "Updating issue #${existing}: ${TITLE}"
              gh issue edit "${existing}" --title "${TITLE}" --body-file body.md
            else
              echo "Opening new issue: ${TITLE}"
              gh issue create --title "${TITLE}" --body-file body.md \
                --label "${LABEL}"
            fi
          elif [ -n "${existing}" ]; then
            echo "No fixable vulnerabilities or OpenVEX gaps left; closing #${existing}"
            gh issue close "${existing}" --reason completed --comment \
              "All previously reported vulnerabilities now have no available fix or are resolved, and the OpenVEX document names every in-scope pip advisory. Verified by ${RUN_URL}."
          else
            echo "No fixable vulnerabilities and no open issue. Nothing to do."
          fi

      - name: Report scheduled failure as issue
        if: failure() && github.event_name == 'schedule'
        uses: $/.github/actions/report-scheduled-failure
        with:
          note: The vulnerability report did not complete, so the rolling issue may be stale.
