name: Marketplace smoke test

# End-to-end tests of the *published* integration surfaces. Unlike the
# smoke jobs in ci.yml (which use `./` and `try-repo` — the working
# tree), the jobs here consume what a user consumes: the action as
# `tmatens/compose-lint@<sha>` from the Marketplace, and the pre-commit
# hook as `repo: https://github.com/tmatens/compose-lint` at a release
# tag. They catch regressions that only show up at the publish
# boundary: a missing or broken tag, a packaging regression, a broken
# published action.yml, a PyPI outage, etc.
#
# Auto-triggers on push-to-main that touches this file — i.e., when
# the `bump-marketplace-smoke-pin` PR from publish.yml merges, the
# smoke runs against the newly-pinned release without a manual click.
# `release: published` would fire before the pin bump lands, smoking
# the *previous* release; gating on the pin-bump merge avoids that.
# Also triggerable manually from Actions tab for ad-hoc re-verification,
# and weekly on a schedule: a regression that develops *between*
# releases (a yanked dependency, a resolver change, a PyPI- or
# GitHub-side issue) is otherwise invisible until a user's workflow
# breaks (issue #570).
#
# When cutting a new release, bump the commit SHA on the two
# `uses:` lines below (and the trailing `# vX.Y.Z` comment so a
# human can still read the version at a glance). Third-party
# actions in this repo are pinned to full commit SHAs per the
# `workflow/third-party-action-not-pinned-to-commit-sha` CodeQL
# rule and the precedent set in commit b59847c ("Pin third-party
# GitHub Actions to commit SHAs"). `steps[].uses` does not support
# ${{ }} expressions, so the SHA has to live in the file.
#
# Note: pinning to a SHA rather than the tag means this smoke test
# would not catch a hypothetical force-push of `v0.2.0` to a new
# commit. That failure mode is covered by our release process
# (signed annotated tags, never re-tagged) rather than by this
# workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/marketplace-smoke.yml
  schedule:
    # Weekly re-verification of both published surfaces. Failures email
    # the workflow author (see docs/CI.md "Where findings land").
    - cron: "13 9 * * 1"

permissions: {}

# The release both jobs consume. Hoisted to workflow scope so the PyPI
# propagation gate and the pre-commit rev read one pin; publish.yml's
# bump-marketplace-smoke-pin seds this literal line, which does not care
# where in the file it lives.
env:
  CL_RELEASE_TAG: v0.24.0

jobs:
  # This workflow's whole point is to run moments after a publish — the
  # pin-bump merge is its trigger — and that is exactly when PyPI's /simple/
  # index has not caught up with the JSON API yet. Every job below that
  # resolves compose-lint from PyPI waits on this one (#612).
  #
  # It was a step inside marketplace-smoke when it landed; the one-shot job
  # below is a second consumer, and duplicating a retry loop is how two
  # copies start drifting toward the weaker one. The extra runner spin-up
  # buys a failure that names itself in the job list instead of hiding in
  # another job's step log.
  pypi-propagated:
    name: Release is visible on PyPI's index
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Wait for the release to reach PyPI's /simple/ index
        run: |
          set -euo pipefail
          version="${CL_RELEASE_TAG#v}"
          # PEP 691 JSON view of the same /simple/ index pip resolves against,
          # so a hit here means pip can see the version — unlike the JSON API
          # (/pypi/<name>/json), which goes live seconds after publish and
          # would report ready while pip still 404s.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL \
                 -H 'Accept: application/vnd.pypi.simple.v1+json' \
                 https://pypi.org/simple/compose-lint/ \
               | jq -e --arg v "${version}" 'any(.versions[]; . == $v)' >/dev/null; then
              echo "compose-lint ${version} is visible on the /simple/ index."
              exit 0
            fi
            if [ "${attempt}" = 6 ]; then
              echo "::error::compose-lint ${version} is still absent from PyPI's /simple/ index after 6 attempts over ~100s. Either the release never published, or propagation is unusually slow — re-run this workflow before treating it as a regression."
              exit 1
            fi
            echo "Attempt ${attempt}: ${version} not on the /simple/ index yet; sleeping 20s..."
            sleep 20
          done

  marketplace-smoke:
    name: Smoke test published action
    needs: pypi-propagated
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clean fixture should pass
        uses: tmatens/compose-lint@d6e1817352200adbd0a72893fd7ea7880874759b # v0.24.0
        with:
          files: tests/smoke/clean.yml
          fail-on: high

      - name: Insecure fixture should fail
        id: insecure
        continue-on-error: true
        uses: tmatens/compose-lint@d6e1817352200adbd0a72893fd7ea7880874759b # v0.24.0
        with:
          files: tests/smoke/insecure.yml
          fail-on: high

      - name: Assert insecure run failed
        if: steps.insecure.outcome != 'failure'
        run: |
          echo "::error::Expected action to fail on insecure fixture, got '${{ steps.insecure.outcome }}'"
          exit 1

  # The pre-commit arm of the published-surface smoke (issue #570).
  # Consumers pin `repo: https://github.com/tmatens/compose-lint` at a
  # release tag and pre-commit builds the hook environment from that
  # tag — a boundary ci.yml's `precommit-smoke` (`try-repo` against the
  # working tree) never crosses. This is the same blind spot the action
  # surface had through 0.3.x, and issue #465 established that
  # pre-commit is the mode where untested gaps reach users first.
  precommit-published-smoke:
    name: Smoke test published pre-commit hook
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned dev env
        run: pip install --require-hashes -r requirements-dev.lock

      # Same one-source-of-truth contract as every other smoke job: the
      # shared tests/smoke/ fixtures define what "clean" and "insecure"
      # mean, and each case builds a throwaway repo around them.
      - name: Clean fixture should pass via the published hook
        env:
          SMOKE: ${{ runner.temp }}/published-pass
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE"
          cp tests/smoke/clean.yml "$SMOKE/docker-compose.yml"
          printf 'repos:\n  - repo: https://github.com/tmatens/compose-lint\n    rev: %s\n    hooks:\n      - id: compose-lint\n' \
            "$CL_RELEASE_TAG" > "$SMOKE/.pre-commit-config.yaml"
          cd "$SMOKE"
          git init -q
          git add -A
          pre-commit run --all-files --verbose 2>&1 | tee out.txt
          # A hook that matched no files "passes" trivially. Assert it ran.
          if grep -q "no files to check" out.txt; then
            echo "::error::Hook selected no files — the smoke test proved nothing."
            exit 1
          fi
          grep -q "docker-compose.yml" out.txt \
            || { echo "::error::Hook did not receive docker-compose.yml"; exit 1; }

      - name: Insecure fixture should fail via the published hook
        env:
          SMOKE: ${{ runner.temp }}/published-fail
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE"
          cp tests/smoke/insecure.yml "$SMOKE/docker-compose.yml"
          printf 'repos:\n  - repo: https://github.com/tmatens/compose-lint\n    rev: %s\n    hooks:\n      - id: compose-lint\n' \
            "$CL_RELEASE_TAG" > "$SMOKE/.pre-commit-config.yaml"
          cd "$SMOKE"
          git init -q
          git add -A
          if pre-commit run --all-files; then
            echo "::error::Expected the published hook to fail on the insecure fixture."
            exit 1
          fi

  # README's Installation section offers two ad-hoc runners as first-class
  # alternatives to `pip install`:
  #
  #     uvx compose-lint docker-compose.yml
  #     pipx run compose-lint docker-compose.yml
  #
  # Every install in CI — ci.yml, publish.yml's testpypi-smoke,
  # marketplace-smoke, os-smoke — went through `pip` (#613). The one
  # adjacent case, testpypi-smoke's `pipx run --spec <local wheel>` (#575),
  # deliberately hands pipx a *file* so TestPyPI is never configured as an
  # index — so it exercises neither name resolution from PyPI nor uv at
  # all. Console-script generation and isolated-environment layout differ
  # enough between pip, pipx and uv that any one of them can break alone,
  # and a broken `uvx compose-lint` is invisible to us until a user says so.
  #
  # Weekly rather than PR-time, alongside the other published-surface
  # checks: what this can catch is a regression in the published artifact
  # or in a third-party runner, neither of which a PR changes.
  oneshot-runners-smoke:
    name: Smoke test the advertised one-shot runners
    needs: pypi-propagated
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Exactly the two forms README advertises. `pipx install` /
        # `uv tool install` are not tested because they are not offered —
        # testing an install method we do not document would assert a
        # contract with nobody on the other end.
        include:
          - runner: uvx
            command: uvx compose-lint
          - runner: pipx
            command: pipx run compose-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pipx is preinstalled on ubuntu-24.04; uv is not.
      - if: matrix.runner == 'uvx'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # The advertised form pins nothing — it resolves the newest release,
      # which is what CL_RELEASE_TAG names both after a pin bump and on the
      # weekly cron. Asserting they agree is what makes this job meaningful
      # between releases: a yanked release, or a resolver that starts
      # preferring something older, shows up here as a mismatch rather than
      # as a silent pass on the wrong version.
      - name: Resolves the current release
        env:
          CL_RUN: ${{ matrix.command }}
        run: |
          set -euo pipefail
          expected="compose-lint ${CL_RELEASE_TAG#v}"
          actual="$(${CL_RUN} --version)"
          echo "Expected: ${expected}"
          echo "Actual:   ${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::${CL_RUN} resolved '${actual}', expected '${expected}'"
            exit 1
          fi

      - name: Clean fixture exits 0
        env:
          CL_RUN: ${{ matrix.command }}
        run: ${CL_RUN} tests/smoke/clean.yml

      - name: Insecure fixture exits 1
        env:
          CL_RUN: ${{ matrix.command }}
        run: |
          exit_code=0
          ${CL_RUN} tests/smoke/insecure.yml || exit_code=$?
          if [ "${exit_code}" -ne 1 ]; then
            echo "::error::Expected exit code 1 from ${CL_RUN}, got ${exit_code}"
            exit 1
          fi
