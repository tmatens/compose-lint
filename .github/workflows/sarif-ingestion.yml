name: SARIF ingestion

# Proves GitHub accepts the SARIF compose-lint emits (issue #610).
#
# `tests/test_sarif.py` asserts the document's shape against the same
# mental model that produced it, and no job anywhere ingested a
# compose-lint SARIF into Code Scanning — `ci.yml`'s action smoke sets
# `upload-sarif: "false"` deliberately, and the only `upload-sarif` calls
# in the repo carry Scorecard, Docker Scout and CodeQL output. So the
# rejections that are invisible to a shape assertion — a duplicate
# `ruleId`, an out-of-range region, a missing `artifactLocation` base, a
# `level` GitHub does not accept — surfaced first in a *consumer's* job.
# `upload-sarif` became a first-class input in 0.19.0, which makes the
# upload path more of a surface, not less.
#
# Not on the PR gate, for three reasons rather than one:
#   1. Fork PRs can never hold `security-events: write` (the same reason
#      action-smoke passes `upload-sarif: "false"`), so the job would be
#      structurally unavailable on exactly the contributions least likely
#      to have been checked locally.
#   2. It would push deliberately-insecure fixture findings into this
#      repo's alert set on every PR.
#   3. What it can catch is a change in our SARIF or in GitHub's
#      acceptance of it — the first is caught post-merge one commit later,
#      the second has no PR to attach to at all.
# Its own workflow rather than a job in ci.yml so `security-events: write`
# is scoped to one file that does nothing else.
on:
  push:
    branches: [main]
    paths:
      - src/compose_lint/formatters/**
      - src/compose_lint/attack.py
      - src/compose_lint/rules/**
      - src/compose_lint/models.py
      - tests/smoke/**
      - action.yml
      - scripts/verify_sarif_ingestion.py
      - .github/workflows/sarif-ingestion.yml
  workflow_dispatch:
  schedule:
    # GitHub can tighten SARIF acceptance with no change on our side, and
    # that has no commit to hang off. Same reasoning as marketplace-smoke's
    # weekly re-verification of published surfaces (#570).
    - cron: "41 11 * * 1"

permissions: {}

jobs:
  ingest:
    name: GitHub ingests our SARIF
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ubuntu-24.04's system python is externally managed (PEP 668), so a
      # bare `pip install` into it fails. The working-tree steps below need
      # a real install of the checkout.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      # All three fixtures together, so the document carries several
      # artifactLocations, all three SARIF levels, and a suppression — the
      # constructs a single-file probe would never produce.
      #
      # The config keeps the lint itself at exit 0, so a failed upload is the
      # only thing that can turn this job red; it explains itself, and
      # tests/test_sarif_ingestion_probe.py holds this step to that contract
      # at PR time.
      - name: Upload the probe SARIF to Code Scanning
        uses: ./
        with:
          files: tests/smoke/insecure.yml tests/smoke/sarif-shape.yml tests/smoke/clean.yml
          config: tests/smoke/sarif-probe-config.yml
          fail-on: critical
          sarif-file: sarif-ingestion-probe.sarif
          upload-sarif: "true"
          version: latest

      # An accepted POST is not ingestion. `upload-sarif` waits for
      # processing, but a document that lands with every result discarded
      # still passes that step.
      - name: Assert the results actually landed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify_sarif_ingestion.py verify

      # The job above installs `version: latest` — the *published* package —
      # so it validates whatever PyPI is serving, not what is on this branch.
      # That is right for catching drift between the source action and the
      # release, and useless for a change to the SARIF we are about to ship:
      # a new construct would first meet GitHub only after publishing, past
      # the point of no return (#632 review).
      #
      # So the working tree gets its own upload. It bypasses the action and
      # calls the uploader directly, because the action installs from PyPI by
      # design and there is no input that points it at a checkout. A separate
      # `category` keeps the two analyses distinct so cleanup can tell them
      # apart.
      # The overlay half of the probe is written here rather than committed,
      # because the condition under test is precisely that the file is *not*
      # in the repository. A `compose.override.yml` is normally gitignored —
      # it is the documented home for local changes — so a SARIF result whose
      # artifactLocation names it points at a path Code Scanning cannot
      # resolve against the commit.
      #
      # Answered (#631): GitHub keeps it. The upload ingested every result
      # with no analysis warning, and the alert stayed queryable at the
      # overlay's path. So this is no longer an open question but a regression
      # guard — GitHub can tighten ingestion with no commit on our side, which
      # is why the schedule above exists.
      - name: Write the untracked overlay half of the probe
        run: |
          cp tests/smoke/overlay/override.yml.tmpl \
             tests/smoke/overlay/compose.override.yml
          git status --porcelain --ignored tests/smoke/overlay/ | sed 's/^/  /'

      - name: Generate SARIF from the working tree
        run: |
          python3 -m pip install --quiet --require-hashes -r requirements.lock
          python3 -m pip install --quiet --no-deps -e .
          # Exit 1 is expected and is not this job's failure signal: the
          # overlay probe deliberately produces a CRITICAL, and the point of
          # the step is the document, not the gate. Exit 2 still fails — that
          # is compose-lint unable to complete, which would leave the SARIF
          # truncated or absent.
          set +e
          python3 -m compose_lint check \
            --config tests/smoke/sarif-probe-config.yml \
            --fail-on critical --format sarif \
            tests/smoke/insecure.yml tests/smoke/sarif-shape.yml tests/smoke/clean.yml \
            tests/smoke/overlay/compose.yml \
            > working-tree.sarif
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "::error::compose-lint could not complete (exit $status)"
            exit "$status"
          fi
          python3 -c "import json;d=json.load(open('working-tree.sarif'));print('results:',len(d['runs'][0]['results']))"
          python3 -c "import json;d=json.load(open('working-tree.sarif'));print('locations:',sorted({r['locations'][0]['physicalLocation']['artifactLocation']['uri'] for r in d['runs'][0]['results']}))"

      - name: Upload the working tree's SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: working-tree.sarif
          category: compose-lint-working-tree

      # `--expect-path` is the #631 question: did the result whose location is
      # the untracked overlay survive ingestion, or did GitHub keep the
      # analysis and drop that one?
      - name: Assert the working tree's results landed too
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verify_sarif_ingestion.py verify \
            --expect-path tests/smoke/overlay/compose.override.yml

      # `always()`: the probe cleans up after a failed assertion too,
      # otherwise a red run leaves the fixture findings behind precisely
      # when nobody is looking for them.
      - name: Remove the probe's alerts
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify_sarif_ingestion.py cleanup
