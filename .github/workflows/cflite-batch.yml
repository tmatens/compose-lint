name: ClusterFuzzLite batch fuzzing

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  batch-fuzzing:
    permissions:
      contents: read
      # security-events for the SARIF upload, issues for the failure report
      # below. ClusterFuzzLite's own reference workflows run with read-all
      # and still upload corpus and crash artifacts, so `actions: write`
      # had no consumer here. Verified by a dispatched run after the drop.
      security-events: write
      issues: write
    runs-on: ubuntu-24.04
    # Fuzzer build plus a 600-second run per sanitizer; the rest is headroom
    # for the base-image pull.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: ${{ matrix.sanitizer }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: ${{ matrix.sanitizer }}
          fuzz-seconds: 600
          mode: batch
          output-sarif: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report scheduled failure as issue
        if: failure() && github.event_name == 'schedule'
        uses: $/.github/actions/report-scheduled-failure
        with:
          leg: ${{ matrix.sanitizer }}
