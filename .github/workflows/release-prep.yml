name: Release prep

# Maintainer-triggered. Opens the "Prepare X.Y.Z release" PR for you:
# validates the CHANGELOG [Unreleased] section, bumps the source-of-truth
# version strings via scripts/bump-version.sh, bumps the self-referencing
# version pins in README.md + docs/ that the version-consistency job
# enforces (#443), renames the CHANGELOG [Unreleased] section to
# [X.Y.Z] - <today>, inserts a fresh empty [Unreleased] above it, updates
# the CHANGELOG compare-link footer, commits on a release/X.Y.Z branch,
# and opens a PR against main.
#
# The signed annotated tag is NOT created here. After the PR merges,
# run `git tag -s vX.Y.Z -m "compose-lint X.Y.Z" && git push origin vX.Y.Z`
# from your workstation. That signature is the root of the Sigstore
# provenance chain; the publish workflow also refuses to trigger on tags
# created via GITHUB_TOKEN, so automating tag creation here would break
# the pipeline even if we wanted to.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.7) — no 'v' prefix"
        required: true
        type: string

permissions: {}

jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          # Push the release branch as the PAT user so the PR it authors below
          # triggers checks (#342). Falls back to GITHUB_TOKEN when the secret is
          # absent: unlike the marketplace-pin job this workflow touches no
          # .github/workflows/* file, so GITHUB_TOKEN still functions — it just
          # yields a check-less PR that needs a manual close+reopen.
          token: ${{ secrets.MARKETPLACE_SMOKE_PAT || github.token }}

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '${VERSION}' is not in X.Y.Z format"
            exit 1
          fi
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Branch release/${VERSION} already exists on origin"
            exit 1
          fi

      # release-prep.yml only *renames* [Unreleased] -> [X.Y.Z]; it never
      # authors or reorders entries, so whatever shape the section is in when
      # this runs is what ships — in the GitHub Release notes too. Two shapes
      # have reached a release candidate:
      #   - 0.17.0: [Unreleased] was empty while eleven PRs had landed, which
      #     would have shipped a blank section and blank release notes.
      #   - 0.18.0: it carried two "### Security" and two "### Fixed" blocks
      #     with "### Changed" between them, so renaming the header would have
      #     shipped the duplicates inside [0.18.0].
      # The changelog-gate job catches neither: it only asserts a section
      # exists for the bumped version, which a renamed-but-malformed section
      # satisfies. Check here, before anything is modified, so a bad changelog
      # costs nothing but a re-dispatch.
      - name: Validate CHANGELOG [Unreleased] section
        run: |
          python - <<'PY'
          import pathlib, re, sys

          # Keep a Changelog's order, with this repo's "Upgrading" preamble first.
          ORDER = ["Upgrading", "Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]

          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next((i for i, ln in enumerate(lines) if ln.startswith("## [Unreleased]")), None)
          if start is None:
              sys.exit("::error::No '## [Unreleased]' section in CHANGELOG.md")
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## [")),
              len(lines),
          )

          # A '###' inside a fenced block is sample text, not a section heading.
          headings: list[str] = []
          fenced = has_content = False
          for line in lines[start + 1 : end]:
              if re.match(r"^(```|~~~)", line.strip()):
                  fenced = not fenced
              if not fenced and line.startswith("### "):
                  headings.append(line[4:].strip())
                  continue
              if line.strip():
                  has_content = True

          if not has_content:
              sys.exit(
                  "::error::[Unreleased] is empty. This workflow only renames the "
                  "header, so releasing now would ship a blank section and blank "
                  "GitHub Release notes. Author the entries first — `git log "
                  "v<PREV>..HEAD` lists what landed."
              )

          if dupes := sorted({h for h in headings if headings.count(h) > 1}):
              sys.exit(
                  f"::error::[Unreleased] has duplicate sections: {dupes}. Merge each "
                  "pair into one before releasing, or the duplicates ship inside the "
                  "release section."
              )

          if unknown := [h for h in headings if h not in ORDER]:
              sys.exit(f"::error::[Unreleased] has unrecognised sections: {unknown}. Expected some of {ORDER}.")

          if [ORDER.index(h) for h in headings] != sorted(ORDER.index(h) for h in headings):
              sys.exit(
                  f"::error::[Unreleased] sections are out of order: {headings}. "
                  f"Expected: {[h for h in ORDER if h in headings]}"
              )

          print("[Unreleased] OK:", ", ".join(headings) or "(no subsections)")
          PY

      # Delegate to the same script a maintainer runs by hand, so there is one
      # definition of "what a version bump is". This workflow used to
      # reimplement the bumps with its own `sed` calls, and when #554 added
      # action.yml's DEFAULT_VERSION as a fourth version string it taught the
      # script, RELEASING.md and a new contract test about it — but not this
      # workflow. The 0.18.0 prep PR therefore bumped three of the four and
      # failed its own required check. A future version string added to the
      # script is now picked up here for free.
      - name: Bump version strings
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/bump-version.sh "${VERSION}"

      # The version-consistency job's "self-referencing version pins" step
      # (#443) requires every `compose-lint==X.Y.Z`,
      # `composelint/compose-lint:X.Y.Z`, and `rev: vX.Y.Z` pin in README.md
      # and docs/ to equal pyproject's version. Bumping only pyproject +
      # __init__ therefore opened a PR that failed its own required check on
      # every release — 0.14.1 had to have the bump pushed by hand. Rewrite
      # the same three forms here, over the same file set and exclusions, so
      # the prep PR is green by construction.
      #
      # The `tmatens/compose-lint@<sha> # vX.Y.Z` action-pin form is
      # deliberately NOT handled here: the new tag's commit SHA does not exist
      # until the tag is pushed, so publish.yml's bump-marketplace-smoke-pin
      # job owns that one post-release.
      - name: Bump self-referencing version pins in README and docs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys

          version = os.environ["VERSION"]
          # Keep these patterns and exclusions in lockstep with the
          # "self-referencing version pins" step in .github/workflows/ci.yml.
          patterns = [
              re.compile(r"(compose-lint==)(\d+\.\d+\.\d+)"),
              re.compile(r"(composelint/compose-lint:)(\d+\.\d+\.\d+)"),
              re.compile(r"(rev: v)(\d+\.\d+\.\d+)"),
          ]
          exclude = ("docs/adr/", "docs/publishing/", "docs/state-of-compose.md")

          def targets():
              for f in [pathlib.Path("README.md"), *sorted(pathlib.Path("docs").rglob("*.md"))]:
                  if not f.as_posix().startswith(exclude):
                      yield f

          changed = []
          for f in targets():
              original = f.read_text()
              updated = original
              for pat in patterns:
                  updated = pat.sub(rf"\g<1>{version}", updated)
              if updated != original:
                  f.write_text(updated)
                  changed.append(f.as_posix())
          print("bumped:", ", ".join(changed) if changed else "nothing (already current)")

          # Re-scan so this workflow fails loudly here rather than as a red
          # required check on the PR it just opened.
          stale = [
              f"{f.as_posix()}:{i}: {m.group(0)}"
              for f in targets()
              for i, line in enumerate(f.read_text().splitlines(), 1)
              for pat in patterns
              for m in pat.finditer(line)
              if m.group(2) != version
          ]
          if stale:
              sys.exit("::error::pins still stale after bump: " + "; ".join(stale))
          PY

      - name: Rename CHANGELOG [Unreleased] and insert fresh header
        env:
          VERSION: ${{ inputs.version }}
        run: |
          today=$(date -u +%Y-%m-%d)
          awk -v v="${VERSION}" -v d="${today}" '
            !done && /^## \[Unreleased\]/ {
              print "## [Unreleased]"
              print ""
              print "## [" v "] - " d
              done=1
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.new
          if ! grep -qE "^## \[${VERSION}\] - " CHANGELOG.md.new; then
            echo "::error::Failed to rewrite CHANGELOG.md — no [Unreleased] header found?"
            rm -f CHANGELOG.md.new
            exit 1
          fi
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Update CHANGELOG compare links
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # The [Unreleased] footer link encodes the previous release as
          # vPREV...HEAD. Point [Unreleased] at the new version and insert a
          # [X.Y.Z] link comparing vPREV...vX.Y.Z. This is cosmetic, so warn
          # (don't fail the release) if the footer link is missing or unparseable.
          url="https://github.com/${REPO}/compare"
          unreleased=$(grep -E '^\[Unreleased\]: ' CHANGELOG.md || true)
          if [ -z "${unreleased}" ]; then
            echo "::warning::No [Unreleased] compare link in CHANGELOG.md; skipping footer update"
            exit 0
          fi
          prev=$(printf '%s\n' "${unreleased}" \
            | sed -nE 's#^.*/compare/v([0-9]+\.[0-9]+\.[0-9]+)\.\.\.HEAD$#\1#p')
          if [ -z "${prev}" ]; then
            echo "::warning::Could not parse previous version from '${unreleased}'; skipping footer update"
            exit 0
          fi
          awk -v v="${VERSION}" -v prev="${prev}" -v url="${url}" '
            /^\[Unreleased\]: / {
              print "[Unreleased]: " url "/v" v "...HEAD"
              print "[" v "]: " url "/v" prev "...v" v
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md
          grep -E "^\[Unreleased\]: |^\[${VERSION}\]: " CHANGELOG.md

      # All four source-of-truth strings, not just the two this workflow used
      # to write. A miss here is a red required check on the PR at best, and at
      # worst — for action.yml's DEFAULT_VERSION — an Action that installs a
      # different linter than the one its SHA pins.
      - name: Verify versions match
        env:
          VERSION: ${{ inputs.version }}
        run: |
          pyproject=$(grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          init=$(grep '__version__' src/compose_lint/__init__.py | head -1 | cut -d'"' -f2)
          action=$(grep -E '^[[:space:]]*DEFAULT_VERSION="' action.yml | head -1 | cut -d'"' -f2)
          echo "pyproject=${pyproject} init=${init} action.yml=${action} input=${VERSION}"
          for got in "${pyproject}" "${init}" "${action}"; do
            if [ "${got}" != "${VERSION}" ]; then
              echo "::error::Post-bump version mismatch: pyproject=${pyproject}, init=${init}, action.yml=${action}, input=${VERSION}"
              exit 1
            fi
          done

      - name: Commit, push, open PR
        env:
          VERSION: ${{ inputs.version }}
          # Author the PR with the PAT so its checks run automatically (#342);
          # fall back to GITHUB_TOKEN when the secret is absent (the PR then
          # needs a manual close+reopen to start checks, the prior behavior).
          GH_TOKEN: ${{ secrets.MARKETPLACE_SMOKE_PAT || github.token }}
        run: |
          branch="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          # `-u` stages every tracked file the steps above modified — the three
          # version files, CHANGELOG.md, and whichever README/docs carried a
          # self-referencing pin. Listing paths explicitly would silently drop
          # a pin in a doc added later, which is the failure #443 guards
          # against. `-u` cannot add untracked files, so nothing stray is swept in.
          git add -u
          git commit -m "Prepare ${VERSION} release"
          git push -u origin "${branch}"
          cat > /tmp/pr-body.md <<EOF
          Automated release prep for \`${VERSION}\`. Review the CHANGELOG entry and version bumps, then squash-merge.

          **After this PR merges**, create and push a signed annotated tag from your workstation:

          \`\`\`
          git checkout main && git pull --ff-only
          git tag -s v${VERSION} -m "compose-lint ${VERSION}"
          git push origin v${VERSION}
          \`\`\`

          The tag push triggers \`publish.yml\`, which runs TestPyPI/Docker smoke tests, waits for your approval on the \`release\` environment, then publishes PyPI + Docker Hub, creates the GitHub Release, and opens a follow-up PR to bump the \`marketplace-smoke\` pin.
          EOF
          sed -i -E 's/^          //' /tmp/pr-body.md
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "Prepare ${VERSION} release" \
            --body-file /tmp/pr-body.md

          {
            echo "### Release prep PR opened"
            echo "Branch: \`${branch}\`"
            echo "Next step: review and merge, then sign-push \`v${VERSION}\`."
          } >> "$GITHUB_STEP_SUMMARY"
