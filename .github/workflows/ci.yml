name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when new commits land.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny-all at the workflow level; every job declares the scopes it needs.
permissions: {}

jobs:
  # Detects which classes of files a PR touches so the expensive jobs below
  # (the 5-version test matrix, coverage, container smokes, rule-premises)
  # can skip when nothing they exercise changed — a docs- or metadata-only
  # PR returns a green `ci-ok` in seconds instead of waiting on container
  # spin-ups. This is per-job gating, NOT a workflow-level `paths:` filter:
  # the only required status check is `ci-ok`, and a workflow-level filter
  # would stop `ci-ok` from ever reporting on a skipped PR, leaving the
  # required check pending forever. `ci-ok` already counts `skipped` as a
  # pass, so gating jobs here is safe. Filters are deliberately inclusive —
  # any source/test/dependency change runs the full suite — and on `push`
  # everything runs unconditionally so main always gets a complete pass.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
      locks: ${{ steps.filter.outputs.locks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute change filters
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # On push (no PR diff context) run every group — main must always
          # get a full validation pass.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "code=true"
              echo "docker=true"
              echo "workflows=true"
              echo "dockerfile=true"
              echo "locks=true"
            } >> "$GITHUB_OUTPUT"
            echo "push event — running all job groups."
            exit 0
          fi
          changed=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          echo "Changed files:"
          echo "${changed}"
          match() { echo "${changed}" | grep -qE "$1"; }
          code=false; docker=false; workflows=false; dockerfile=false; locks=false
          # Python sources, tests, helper scripts, the package manifest,
          # hash-pinned lockfiles, and the action contract all warrant the
          # full lint/type/test/coverage/security/smoke suite.
          # `.pre-commit-hooks.yaml` is in here on purpose: it is the hook
          # contract, and `precommit-smoke` (gated on this filter) is what
          # guards it. Leaving it out meant a manifest-only edit — exactly
          # the shape of issue #465 — skipped its own smoke test.
          if match '^(src/|tests/|scripts/|pyproject\.toml$|requirements[.-].*lock$|action\.yml$|\.pre-commit-hooks\.yaml$)'; then
            code=true
          fi
          if match '^(Dockerfile$|\.dockerignore$|requirements\.lock$|requirements-build\.lock$|pyproject\.toml$|src/)'; then
            docker=true
          fi
          if match '^\.github/workflows/'; then
            workflows=true
          fi
          if match '^Dockerfile$'; then
            dockerfile=true
          fi
          # pyproject.toml is the compile source; the locks are its outputs.
          if match '^(pyproject\.toml$|requirements[.-].*lock$)'; then
            locks=true
          fi
          {
            echo "code=${code}"
            echo "docker=${docker}"
            echo "workflows=${workflows}"
            echo "dockerfile=${dockerfile}"
            echo "locks=${locks}"
          } >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-build.lock
      - name: Install pinned dev env
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  type-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-build.lock
      - name: Install pinned dev env
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - run: mypy src/

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-build.lock
      - name: Install pinned dev env
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - run: pytest

  # Enforces the OpenSSF Best Practices Silver `test_statement_coverage80`
  # criterion: statement coverage must stay >= 80% on the trunk. Runs on
  # one Python version (3.13, matches lint/type-check/security) — the
  # matrix `test` job already covers cross-version pass/fail. The
  # threshold is configured in pyproject.toml [tool.coverage.report];
  # `--cov-fail-under=80` here makes the gate explicit at the workflow
  # level so a config drift can't silently lower it.
  coverage:
    name: Test coverage (>= 80% statement)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-build.lock
      - name: Install pinned dev env
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Enable subprocess coverage
        # test_cli.py and test_integration.py invoke `python -m compose_lint`
        # as a subprocess. The standard pattern for measuring child-process
        # coverage is a site-packages .pth file that calls
        # `coverage.process_startup()` on every interpreter init, gated by
        # `COVERAGE_PROCESS_START`. Combined with `parallel = true` in
        # pyproject.toml, pytest-cov merges the per-process data files
        # automatically before reporting.
        run: |
          site=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "import coverage; coverage.process_startup()" > "${site}/coverage_subprocess.pth"
      - name: Run tests with coverage
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        run: pytest --cov=compose_lint --cov-report=term-missing --cov-fail-under=80

  security:
    name: Security scan (bandit + pip-audit)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-build.lock
      - name: Install scan tools
        # Upgrade pip first so pip-audit doesn't flag CVEs in the
        # runner-bundled pip itself (those are out of scope for this
        # project's supply chain). The pip upgrade is deliberately
        # unpinned per the "always-latest for the bootstrap" exception
        # in AGENTS.md "Dependency pinning". bandit and pip-audit come
        # from the hash-pinned dev lockfile.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Bandit (source SAST)
        run: bandit -r src/ -ll
      - name: pip-audit (dependency CVEs)
        # INFORMATIONAL on PRs (continue-on-error) — not a merge gate.
        # pip-audit queries a live advisory DB, so a newly disclosed CVE
        # against an *unchanged* pinned dep flips this red with no code
        # change, which would block every unrelated open PR at once (see
        # the 2026-06 cryptography/msgpack incident). Detection of new
        # advisories is handled continuously by Renovate's OSV alerts
        # (renovate.json), and the hard gate runs at release time in
        # publish.yml's `build` job, where the build/publish toolchain
        # actually executes. Keep the --ignore-vuln set in sync with that
        # publish-time step.
        #
        # --skip-editable skips compose-lint itself (it isn't on PyPI
        # for the local install path); PyYAML and any future runtime
        # deps are still scanned.
        #
        # There are deliberately NO --ignore-vuln entries. An ignore is
        # only ever justified for an advisory with no installable fix,
        # and every such entry rots: its justification depends on facts
        # (someone else's pin, an unfixed upstream) that change without
        # notice, while the suppression stays. A rotted ignore is
        # invisible to pip-audit, which filters it by ID, and to
        # Renovate, whose pin is still satisfiable, at the same time —
        # see the tuf/GHSA-qp9x-wp8f-qgjj case. Prefer bumping the
        # lockfile. If an unfixable advisory ever genuinely needs
        # suppressing, add it here AND to publish.yml, and expect
        # vuln-report.yml to keep listing it.
        continue-on-error: true
        run: pip-audit --skip-editable

  # Fails the PR if any requirements*.lock has drifted from pyproject.toml —
  # a dep added, removed, or re-pinned without regenerating the locks. CI
  # otherwise only installs *from* the locks (`--require-hashes`) and never
  # recompiles, so drift previously surfaced only as a downstream test failure
  # for deps something imports, and not at all for tool pins nothing imports.
  #
  # Recompiling is safe to diff byte-for-byte: with the output file present,
  # `uv pip compile` reuses its existing pins as preferences, so this does NOT
  # chase new upstream releases and go red on unrelated PRs. Verified
  # byte-identical under uv 0.11.19 and 0.12.3, and verified to exit 1 when a
  # pyproject pin is changed without a regen.
  #
  # Commands must stay identical to the regen block in CLAUDE.md, including
  # the `=`/`--output-file=` flag form that Renovate's pip-compile manager
  # requires to parse these headers at all.
  lockfiles:
    name: Lockfiles match pyproject.toml
    needs: changes
    if: needs.changes.outputs.locks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned for a deterministic byte-diff. Bumping is safe — the lock output
      # was verified stable across the 0.11 -> 0.12 span — but do it
      # deliberately, not implicitly.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Recompile every lockfile from pyproject.toml
        run: |
          set -euo pipefail
          uv pip compile pyproject.toml \
            --universal --python-version=3.10 \
            --generate-hashes --output-file=requirements.lock
          uv pip compile pyproject.toml \
            --extra=dev --extra=lint --extra=security --extra=publish \
            --universal --python-version=3.10 \
            --generate-hashes --output-file=requirements-dev.lock
          uv pip compile pyproject.toml --extra=docs \
            --universal --python-version=3.10 \
            --generate-hashes --output-file=requirements-docs.lock
          uv pip compile pyproject.toml --extra=container \
            --universal --python-version=3.10 \
            --generate-hashes --output-file=requirements-build.lock
      - name: Fail if any lockfile drifted
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- 'requirements*.lock'; then
            echo "::error::A lockfile is out of sync with pyproject.toml. Re-run the regen commands in CLAUDE.md and commit the result."
            exit 1
          fi
          echo "All four lockfiles reproduce byte-for-byte."

  # Fails the PR if `pyproject.toml` and `src/compose_lint/__init__.py`
  # disagree about the project version. The two strings drifted silently
  # before 0.2.0 and are the single most-called-out release hazard in
  # docs/RELEASING.md. This guard catches the drift at review time rather
  # than at tag-push time (where the tag would already be minted against a
  # wrong source of truth).
  version-consistency:
    name: Version strings in sync
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Parse the versions structurally rather than by grep (#382): a commented
      # "# version = ..." above the real line, or reformatting, would fool
      # `grep '^version =' | head -1`. tomllib reads pyproject's [project].version
      # and ast reads __init__.py's __version__ assignment — deterministic, no
      # regex to drift.
      #
      # action.yml's DEFAULT_VERSION is the third source-of-truth string, and it
      # was NOT checked here until 0.18.0 — so this job could report "Version
      # strings in sync" while that one was a release behind, which is exactly
      # what happened on the 0.18.0 prep PR. A check whose name overclaims is
      # worse than no check: it was read as covering all of them.
      # tests/test_action_contract.py asserts the same equality, but it lives in
      # the `test` matrix, so it does not run when only a version file changes.
      # DEFAULT_VERSION is a shell assignment inside a `run:` block, so it is
      # matched by an anchored regex (PyYAML is not installed in this job, and a
      # YAML parse would only get us to the same string).
      - name: Compare pyproject.toml, __init__.py and action.yml
        run: |
          python - <<'PY'
          import ast, pathlib, re, sys, tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]

          init = None
          for node in ast.walk(ast.parse(pathlib.Path("src/compose_lint/__init__.py").read_text())):
              if isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets
              ) and isinstance(node.value, ast.Constant):
                  init = node.value.value

          found = re.findall(r'^\s*DEFAULT_VERSION="([^"]*)"', pathlib.Path("action.yml").read_text(), re.M)
          if len(found) != 1:
              sys.exit(f"::error::Expected exactly one DEFAULT_VERSION in action.yml, found {len(found)}")
          action = found[0]

          print(f"pyproject.toml: {pyproject}")
          print(f"__init__.py:    {init}")
          print(f"action.yml:     {action}")
          if not pyproject or not init or not action:
              sys.exit("::error::Could not extract version from one or more files")
          drift = {"pyproject.toml": pyproject, "src/compose_lint/__init__.py": init, "action.yml": action}
          if len(set(drift.values())) != 1:
              sys.exit("::error::Version drift: " + ", ".join(f"{k} ({v})" for k, v in drift.items()))
          PY
      # Self-referencing version pins in living docs (README integration
      # snippets, docs/hardening.md) must equal the current version. A
      # hand-maintained checklist can't self-discover new references — v0.14.0
      # shipped with every doc pin stale despite RELEASING.md listing them —
      # so any new doc that pins our own artifacts is covered from its first
      # commit. Historical records (ADRs, CHANGELOG-adjacent reports) are
      # excluded. The `tmatens/compose-lint@<sha>` action-pin form is also
      # excluded: the new tag's SHA exists only after the release, so it is
      # structurally a post-release follow-up (RELEASING.md pairs it with the
      # marketplace-smoke bump, and the smoke test exercises it end-to-end).
      - name: Check self-referencing version pins in docs
        run: |
          python - <<'PY'
          import pathlib, re, sys, tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]

          patterns = [
              re.compile(r"compose-lint==(\d+\.\d+\.\d+)"),
              re.compile(r"composelint/compose-lint:(\d+\.\d+\.\d+)"),
              re.compile(r"rev: v(\d+\.\d+\.\d+)"),
          ]
          exclude = ("docs/adr/", "docs/publishing/", "docs/state-of-compose.md")
          stale = []
          for f in [pathlib.Path("README.md"), *sorted(pathlib.Path("docs").rglob("*.md"))]:
              p = f.as_posix()
              if p.startswith(exclude):
                  continue
              for i, line in enumerate(f.read_text().splitlines(), 1):
                  for pat in patterns:
                      for m in pat.finditer(line):
                          if m.group(1) != version:
                              stale.append(f"{p}:{i}: {m.group(0)} (current: {version})")
          print(f"current version: {version}")
          if stale:
              print("\n".join(stale))
              sys.exit(f"::error::{len(stale)} stale self-referencing version pin(s) — bump to {version} (docs/RELEASING.md, 'version references' item)")
          print("all self-referencing version pins in README/docs match")
          PY

  # Docker Hub's repository API rejects a `full_description` over 25000 bytes
  # with HTTP 400, which is what docs/dockerhub-overview.md is synced into by
  # the `dockerhub-description` job in publish.yml (the Hub overview is
  # deliberately a separate, trimmed file so README.md is not byte-capped).
  # Without this guard the limit is only discovered at release time, as a red —
  # but by then cosmetic — job long after the tag is cut (v0.14.0 hit exactly
  # that when README.md, then the synced file, reached 25319 bytes). Check it
  # at edit time instead, where the fix is cheap.
  #
  # 25000 is the real ceiling, not a padded one: Docker Hub counts bytes and so
  # does `wc -c`, and v0.14.0's rejection reported `actual 25319` for a file
  # that measured 25319 here. A lower "safety" threshold would only invent a
  # second, fictional limit — the headroom line below gives early warning
  # instead.
  readme-size:
    name: README fits Docker Hub description limit
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check docs/dockerhub-overview.md byte size
        env:
          LIMIT: "25000"
        run: |
          set -euo pipefail
          size=$(wc -c < docs/dockerhub-overview.md)
          echo "docs/dockerhub-overview.md: ${size} / ${LIMIT} bytes"
          if [ "${size}" -gt "${LIMIT}" ]; then
            echo "::error file=docs/dockerhub-overview.md::docs/dockerhub-overview.md is $((size - LIMIT)) bytes over the ${LIMIT}-byte Docker Hub description limit (${size}). Docker Hub will reject the overview sync with HTTP 400. Shorten it."
            exit 1
          fi
          echo "Headroom: $((LIMIT - size)) bytes"

  # If a PR bumps the `version` in pyproject.toml, CHANGELOG.md must already
  # contain a matching `## [X.Y.Z]` section. Without this, a release PR can
  # merge with no release notes and the Publish workflow's `create-release`
  # job fails *after* the tag has been minted — burning a PyPI version
  # number on a broken release.
  changelog-gate:
    name: CHANGELOG entry for version bumps
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require matching CHANGELOG section if version changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -q '^pyproject.toml$'; then
            echo "pyproject.toml not touched; no version bump to gate."
            exit 0
          fi
          base_version=$(git show "${BASE_SHA}:pyproject.toml" | grep -E '^version = ' | head -1 | cut -d'"' -f2)
          head_version=$(git show "${HEAD_SHA}:pyproject.toml" | grep -E '^version = ' | head -1 | cut -d'"' -f2)
          if [ "${base_version}" = "${head_version}" ]; then
            echo "pyproject.toml changed but version line did not; not a release bump."
            exit 0
          fi
          echo "Version bump detected: ${base_version} -> ${head_version}"
          if ! grep -qE "^## \[${head_version}\]" CHANGELOG.md; then
            echo "::error::pyproject.toml bumped to ${head_version} but CHANGELOG.md has no '## [${head_version}]' section"
            exit 1
          fi
          echo "Found matching CHANGELOG section for ${head_version}."

  dco:
    name: Developer Certificate of Origin
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require matching Signed-off-by on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Bot commits (Dependabot, Renovate, github-actions) can't add a
          # Signed-off-by trailer from the Probot runtime. They're allow-listed.
          bot_pattern='(dependabot|renovate|github-actions|mend)\[bot\]'
          bad=""
          while IFS=$'\t' read -r sha author_name author_email; do
            if echo "${author_name}${author_email}" | grep -iqE "${bot_pattern}"; then
              continue
            fi
            expected="Signed-off-by: ${author_name} <${author_email}>"
            if ! git log -1 --format='%B' "${sha}" | grep -qiF "${expected}"; then
              bad="${bad}${sha}	${author_name} <${author_email}>
          "
            fi
          done < <(git log --format='%H%x09%an%x09%ae' "${BASE_SHA}..${HEAD_SHA}")
          if [ -n "${bad}" ]; then
            echo "::error::Commits missing matching Signed-off-by (DCO) trailer:"
            printf '%s' "${bad}" | while IFS=$'\t' read -r sha author; do
              [ -n "${sha}" ] && echo "::error::  ${sha}  ${author}"
            done
            echo "::error::Add 'Signed-off-by: Name <email>' matching your author identity."
            echo "::error::Fix with 'git commit --amend --signoff' or 'git rebase --signoff ${BASE_SHA}'."
            exit 1
          fi
          echo "All PR commits carry a matching Signed-off-by trailer."

  no-ai-attribution:
    name: No AI authorship attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan PR commit messages for AI co-author trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Pattern covers the known offenders: Co-Authored-By trailers
          # naming Claude / Anthropic, and "Generated by" style notices.
          # Matched case-insensitively. CLAUDE.md forbids all of these.
          pattern='co-authored-by:.*(claude|anthropic|@anthropic\.com)|generated (by|with) (claude|anthropic|ai)|🤖 generated'
          bad=$(git log --format='%H%n%B%n--END--' "${BASE_SHA}..${HEAD_SHA}" \
            | awk -v RS='--END--' -v IGNORECASE=1 -v pat="$pattern" \
                'tolower($0) ~ pat { print substr($0, 1, 40) }')
          if [ -n "$bad" ]; then
            echo "::error::Commit(s) contain forbidden AI attribution trailers:"
            echo "$bad" | while read -r sha; do
              [ -n "$sha" ] && echo "::error::  $sha  $(git log -1 --format='%s' "$sha")"
            done
            echo "::error::CLAUDE.md forbids 'Co-Authored-By: Claude ...', 'Generated by AI' notices, and similar AI attribution."
            echo "::error::Amend or reword the offending commit(s) before merging."
            exit 1
          fi
          echo "No AI attribution trailers found in PR commits."

  # Surfaces new dependencies introduced by a PR that carry known CVEs
  # or incompatible licenses — before pip-audit would catch them post-merge
  # against the dev lockfile. Run only on pull_request; the action requires
  # a base ref to diff against.
  dependency-review:
    name: Dependency review (PR deps)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Lints every workflow under .github/workflows/. Catches shell-quoting
  # bugs (via embedded shellcheck), unsafe ${{ }} interpolation in run:
  # blocks, unknown expressions, matrix-config typos, etc. actionlint is
  # installed from its GitHub Release tarball with SHA256 verification so
  # there's no curl-pipe-bash and no third-party composite action to pin.
  # Renovate's github-releases datasource handles version bumps.
  actionlint:
    name: Lint GitHub Actions workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o actionlint.tar.gz "${url}"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          rm actionlint.tar.gz
      - run: ./actionlint -color

  # Fails the PR if any FROM in the Dockerfile pins a per-arch manifest
  # instead of a multi-arch OCI index. Multi-arch regressions otherwise
  # don't surface until docker-publish at release time.
  dockerfile-digests:
    name: Verify Dockerfile digests are manifest lists
    needs: changes
    if: needs.changes.outputs.dockerfile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/verify-dockerfile-digests.sh Dockerfile

  # Builds the Dockerfile on PRs that touch build inputs and runs the
  # image against fixtures. Without this, a broken Dockerfile or runtime
  # dependency change silently rides to tag time where the release
  # `docker-smoke` job is the first thing to notice. amd64-only to keep
  # the gate cheap; the release pipeline covers multi-arch.
  docker-smoke:
    name: Smoke test Dockerfile (amd64)
    # Build inputs are detected centrally by the `changes` job (the `docker`
    # group: Dockerfile, .dockerignore, the runtime/build lockfiles,
    # pyproject.toml, src/). On push, that group is always true.
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: composelint/compose-lint:pr-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Clean fixture exits 0
        run: |
          cat > /tmp/clean.yml <<'YAML'
          services:
            web:
              image: nginx:1.27-alpine
              ports:
                - "127.0.0.1:8080:80"
              security_opt:
                - no-new-privileges:true
              cap_drop:
                - ALL
              read_only: true
          YAML
          docker run --rm -v /tmp/clean.yml:/src/docker-compose.yml composelint/compose-lint:pr-smoke
      - name: Insecure fixture exits 1
        run: |
          cat > /tmp/insecure.yml <<'YAML'
          services:
            app:
              image: myapp:1.0
              privileged: true
          YAML
          exit_code=0
          docker run --rm -v /tmp/insecure.yml:/src/docker-compose.yml composelint/compose-lint:pr-smoke || exit_code=$?
          if [ "${exit_code}" -ne 1 ]; then
            echo "::error::Expected exit code 1, got ${exit_code}"
            exit 1
          fi
      - name: SARIF output is valid JSON
        run: |
          cat > /tmp/test.yml <<'YAML'
          services:
            db:
              image: postgres:16
          YAML
          docker run --rm -v /tmp/test.yml:/src/docker-compose.yml composelint/compose-lint:pr-smoke --format sarif --fail-on critical \
            | python3 -c "import sys, json; json.load(sys.stdin); print('Valid SARIF JSON')"

  action-smoke:
    name: Smoke test action.yml
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Smoke fixtures live in tests/smoke/ and are shared with every
      # other workflow that runs compose-lint end-to-end (publish.yml
      # testpypi-smoke, publish.yml docker-smoke, marketplace-smoke.yml).
      # One source of truth prevents per-workflow drift.

      # `version: latest` is deliberate. The action now *pins* by default so a
      # consumer's SHA-pinned `uses:` gets a reproducible check, but what this
      # job tests is the action.yml contract (inputs, file discovery, SARIF
      # wiring) against whatever compose-lint is currently published. Letting
      # it install the pin would test the source action against itself and hide
      # breakages between the two, which is what happened through 0.3.x.
      - name: Clean fixture should pass
        uses: ./
        with:
          files: tests/smoke/clean.yml
          fail-on: high
          version: latest

      - name: Insecure fixture should fail
        id: insecure
        continue-on-error: true
        uses: ./
        with:
          files: tests/smoke/insecure.yml
          fail-on: high
          version: latest

      - name: Assert insecure run failed
        if: steps.insecure.outcome != 'failure'
        run: |
          echo "::error::Expected action to fail on insecure fixture, got '${{ steps.insecure.outcome }}'"
          exit 1

      # Everything below exercises the inputs the clean/insecure pair does
      # not (issue #574). action.yml's composite shell is the most intricate
      # in the repo, and its documented bug history — $GITHUB_OUTPUT newline
      # forgery, `find -print0` path handling, the 0-byte-SARIF upload — all
      # lived in code paths those two steps never run. The static assertions
      # in tests/test_action_contract.py execute the step scripts in
      # isolation but cannot catch a wiring bug between steps or in the
      # `with:`→env plumbing, so every input gets at least one live
      # `uses: ./` run here.

      - name: Prepare pattern fixtures (spaced path + .git decoy)
        run: |
          set -euo pipefail
          mkdir -p "pattern smoke"
          cp tests/smoke/clean.yml "pattern smoke/pattern smoke fixture.yml"
          # An insecure copy under .git/: if discovery stops pruning .git,
          # the step below lints it and fails.
          cp tests/smoke/insecure.yml ".git/pattern smoke fixture.yml"

      # A pass here is meaningful on three axes: zero matches would exit 2
      # (fail-closed), a mangled spaced path would exit 2 (file not found),
      # and a linted .git decoy would exit 1. Only "found the spaced clean
      # file, skipped .git" is green. `verbose` rides along for input
      # coverage.
      - name: Pattern discovery handles spaces and prunes .git
        uses: ./
        with:
          pattern: "pattern smoke fixture.yml"
          fail-on: high
          verbose: "true"
          version: latest

      - name: Zero-match pattern must fail closed
        id: zero-match
        continue-on-error: true
        uses: ./
        with:
          pattern: "matches-nothing-*.yml"
          version: latest

      - name: Assert zero-match run failed
        if: steps.zero-match.outcome != 'failure'
        run: |
          echo "::error::Expected fail-closed exit on zero matched files, got '${{ steps.zero-match.outcome }}'"
          exit 1

      - name: Zero match with allow-no-files opts out
        uses: ./
        with:
          pattern: "matches-nothing-*.yml"
          allow-no-files: "true"
          version: latest

      # tests/smoke/insecure.yml's only at-or-above-high finding is CL-0002
      # (privileged), so disabling it must flip the gate to a pass. If a new
      # rule starts flagging the fixture at high+, this step fails — update
      # the config below alongside the fixture. `skip-suppressed` and
      # `quiet` ride along for input coverage.
      - name: Prepare a config that suppresses the insecure finding
        run: |
          set -euo pipefail
          printf 'rules:\n  CL-0002:\n    enabled: false\n    reason: "smoke: prove config pass-through flips the gate"\n' \
            > smoke-config.yml

      - name: Config pass-through flips the insecure outcome
        uses: ./
        with:
          files: tests/smoke/insecure.yml
          fail-on: high
          config: smoke-config.yml
          skip-suppressed: "true"
          quiet: "true"
          version: latest

      # `upload-sarif: false` keeps the Code Scanning upload out of the
      # smoke: this job holds no `security-events: write` (fork PRs never
      # can), and fixture findings must not land in the repo's alerts.
      - name: SARIF file is written without uploading
        id: sarif
        uses: ./
        with:
          files: tests/smoke/sarif-shape.yml
          fail-on: critical
          sarif-file: smoke-results.sarif
          upload-sarif: "false"
          version: latest

      - name: Assert SARIF artifact exists and output is set
        env:
          SARIF_WRITTEN: ${{ steps.sarif.outputs.sarif-written }}
        run: |
          set -euo pipefail
          if [ ! -s smoke-results.sarif ]; then
            echo "::error::smoke-results.sarif is missing or empty"
            exit 1
          fi
          python3 -c 'import json; json.load(open("smoke-results.sarif"))'
          if [ "$SARIF_WRITTEN" != "true" ]; then
            echo "::error::sarif-written output was '$SARIF_WRITTEN', expected 'true'"
            exit 1
          fi

      # The documented `files:` contract is a space-separated list; a
      # newline in it must be refused loudly (it could forge output records
      # when filenames crossed $GITHUB_OUTPUT, and still means a malformed
      # list today).
      - name: Newline in files must be refused
        id: newline
        continue-on-error: true
        uses: ./
        with:
          files: |
            tests/smoke/clean.yml
            tests/smoke/insecure.yml
          version: latest

      - name: Assert newline run failed
        if: steps.newline.outcome != 'failure'
        run: |
          echo "::error::Expected rejection of a files list containing a newline, got '${{ steps.newline.outcome }}'"
          exit 1

  # The pre-commit arm of the integration-surface smoke set. `action-smoke`
  # covers action.yml, `docker-smoke` the image, publish.yml's `testpypi-smoke`
  # the wheel — `.pre-commit-hooks.yaml` had nothing, and issue #465 (a broken
  # `files` pattern that made the hook unable to pass) reached a user because
  # of it. tests/test_precommit.py asserts the patterns in isolation; this job
  # runs the real tool so `entry`, `language`, and hook installation are
  # exercised too. `try-repo` reads the manifest from the working tree, so a
  # regression is caught on the PR that introduces it rather than after release.
  precommit-smoke:
    name: Smoke test .pre-commit-hooks.yaml
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned dev env
        run: pip install --require-hashes -r requirements-dev.lock

      # `try-repo` runs against the *current* directory's git repo, so each
      # case builds a throwaway repo whose filenames match the hook's `files`
      # pattern. Reusing tests/smoke/ fixtures keeps one source of truth for
      # what "clean" and "insecure" mean across every smoke job.
      - name: Clean stack with a config present should pass
        env:
          SMOKE: ${{ runner.temp }}/hook-pass
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE"
          cp tests/smoke/clean.yml "$SMOKE/docker-compose.yml"
          # A config in the tree is the issue #465 reproducer: the hook used
          # to hand it to the linter, which exited 2 and could never pass.
          printf 'rules:\n  CL-0004:\n    enabled: false\n    reason: "smoke"\n' \
            > "$SMOKE/.compose-lint.yml"
          git -C "$SMOKE" init -q
          git -C "$SMOKE" add -A
          cd "$SMOKE"
          pre-commit try-repo "$GITHUB_WORKSPACE" compose-lint --all-files \
            --verbose 2>&1 | tee out.txt
          # A hook that matched no files "passes" trivially. Assert it ran.
          if grep -q "no files to check" out.txt; then
            echo "::error::Hook selected no files — the smoke test proved nothing."
            exit 1
          fi
          grep -q "docker-compose.yml" out.txt \
            || { echo "::error::Hook did not receive docker-compose.yml"; exit 1; }
          # Not a bare grep for the config filename: the banner legitimately
          # prints `config: .compose-lint.yml` when the linter *reads* it.
          # Assert the symptom of it being *linted* instead — either the
          # pre-#500 parse failure or the post-#500 skip line.
          if grep -qE "appears to be a compose-lint config|could not be parsed" out.txt; then
            echo "::error::Hook passed its own config to the linter (issue #465)."
            exit 1
          fi

      - name: Insecure stack should fail the hook
        env:
          SMOKE: ${{ runner.temp }}/hook-fail
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE"
          cp tests/smoke/insecure.yml "$SMOKE/docker-compose.yml"
          git -C "$SMOKE" init -q
          git -C "$SMOKE" add -A
          cd "$SMOKE"
          if pre-commit try-repo "$GITHUB_WORKSPACE" compose-lint --all-files; then
            echo "::error::Expected the hook to fail on the insecure fixture."
            exit 1
          fi

      # The two cases below exercise the user `args:` override contract
      # (issue #571). `.pre-commit-hooks.yaml` ships `args: [--]`, and a
      # consumer's own `args:` replaces that default entirely — the README
      # tells them to end their list with `--`. `try-repo` cannot inject a
      # consumer `args:`, so these cases write a real
      # `.pre-commit-config.yaml` pinning this checkout at its own SHA,
      # which also makes them the only PR-gate steps that install the hook
      # the way a consumer does (from a rev, not the working tree).

      # The clean fixture passes at the default high threshold (proved
      # above) and carries two medium findings, so `--fail-on medium` must
      # flip the hook to a failure. A pass here means the override was
      # dropped; a failure without the threshold verdict means it failed
      # for the wrong reason.
      - name: User args override with trailing -- is honored
        env:
          SMOKE: ${{ runner.temp }}/args-override
        run: |
          set -euo pipefail
          REV="$(git rev-parse HEAD)"
          mkdir -p "$SMOKE"
          cp tests/smoke/clean.yml "$SMOKE/docker-compose.yml"
          printf 'repos:\n  - repo: %s\n    rev: %s\n    hooks:\n      - id: compose-lint\n        args: [--fail-on, medium, "--"]\n' \
            "$GITHUB_WORKSPACE" "$REV" > "$SMOKE/.pre-commit-config.yaml"
          cd "$SMOKE"
          git init -q
          git add -A
          if pre-commit run --all-files 2>&1 | tee out.txt; then
            echo "::error::Expected the --fail-on medium override to fail the clean fixture."
            exit 1
          fi
          grep -q "at or above medium" out.txt \
            || { echo "::error::Hook failed for a reason other than the overridden threshold."; exit 1; }

      # A directory named `--config=cfgdir` is the manifest comment's
      # attack shape: with the trailing `--` omitted, argparse absorbs the
      # repository path as a --config flag. The pinned outcome is the loud
      # failure observed live — exit 2, "Config file not found" — never a
      # green run that skipped the file.
      - name: Omitted trailing -- fails loudly, never silently passes
        env:
          SMOKE: ${{ runner.temp }}/args-no-separator
        run: |
          set -euo pipefail
          REV="$(git rev-parse HEAD)"
          mkdir -p "$SMOKE/--config=cfgdir"
          cp tests/smoke/clean.yml "$SMOKE/--config=cfgdir/compose.yml"
          cp tests/smoke/clean.yml "$SMOKE/docker-compose.yml"
          printf 'repos:\n  - repo: %s\n    rev: %s\n    hooks:\n      - id: compose-lint\n        args: [--fail-on, medium]\n' \
            "$GITHUB_WORKSPACE" "$REV" > "$SMOKE/.pre-commit-config.yaml"
          cd "$SMOKE"
          git init -q
          git add -A
          if pre-commit run --all-files 2>&1 | tee out.txt; then
            echo "::error::A flag-shaped path with no -- must not produce a passing run."
            exit 1
          fi
          grep -q "Config file not found" out.txt \
            || { echo "::error::Expected the absorbed-path config error; the failure shape changed — re-pin it."; exit 1; }

  # Runtime arm of the rule-grounding bar: every rule that describes container
  # runtime state must demonstrate its premise against a live container (the
  # insecure state is the Docker default, or the flagged config produces the
  # insecure behavior). Catches the CL-0022/CL-0023 failure mode — a rule that
  # flags a Docker default — before it ships. Runners have Docker preinstalled.
  rule-premises:
    name: Validate rule premises (live container)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate each runtime rule's premise against a live container
        run: python scripts/validate_rule_premises.py

  # Single rollup job for branch protection. Required-status-checks should
  # point at this job name instead of the individual ci.yml job names, so
  # adding/renaming/removing jobs doesn't require a protection-rule edit.
  #
  # `if: always()` ensures the rollup runs when any dependency fails or is
  # skipped — otherwise the overall check stays pending and nothing fails
  # the PR. The script then pass-or-fails explicitly by inspecting each
  # dependency's `result`. `skipped` counts as pass so push-to-main (where
  # pull_request-gated jobs skip) doesn't wedge the required check.
  ci-ok:
    name: ci-ok
    needs:
      - changes
      - lint
      - type-check
      - test
      - coverage
      - security
      - version-consistency
      - readme-size
      - changelog-gate
      - dco
      - no-ai-attribution
      - dependency-review
      - actionlint
      - dockerfile-digests
      - lockfiles
      - docker-smoke
      - action-smoke
      - precommit-smoke
      - rule-premises
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: All required CI jobs must succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if ! echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' >/dev/null; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
