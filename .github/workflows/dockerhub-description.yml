name: Docker Hub description (manual)

# Standalone, manually-triggered resync of the Docker Hub overview from
# docs/dockerhub-overview.md on the default branch (the Hub-facing overview is
# deliberately decoupled from README.md and kept version-free, so it does not
# depend on the post-release version-pin bump). The automated sync is the
# dockerhub-description job in publish.yml, which runs during a release (tag
# push); run this any time the overview changes between releases.
#
# Runs in the `dockerhub-description` environment, which holds the
# Delete-capable token the description PATCH needs and admits only the default
# branch and `v*` tags. A dispatch from any other branch is refused before a
# step runs, so the secret never reaches code from an unreviewed ref. Not `dockerhub`: that environment is tags-only and holds the
# Read & Write push token, which cannot PATCH the description. Reuses the same
# first-party composite action as publish.yml, so no third-party code holds the
# delete-capable PAT.
#
# The checkout below stays pinned to the default branch. The environment already
# refuses other branches, so this is belt-and-braces: it keeps the sync script
# and the overview markdown on main even if the environment's policy is widened.
# See docs/RELEASING.md.

on:
  workflow_dispatch:

permissions: {}

jobs:
  dockerhub-description:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment:
      name: dockerhub-description
      url: https://hub.docker.com/r/composelint/compose-lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not the dispatched ref — see the note at the top of this file.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: $/.github/actions/update-dockerhub-description
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: composelint/compose-lint
          readme-filepath: ./docs/dockerhub-overview.md
