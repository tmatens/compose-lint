name: Age-gate gcr/ghcr digest PRs

# Merges Renovate's digest refreshes from gcr.io and ghcr.io (distroless,
# the oss-fuzz builder, vhs) once they have aged the
# same three days the Docker Hub digests wait under Renovate's own
# minimumReleaseAge gate (#1059).
#
# Why this exists: Renovate's docker datasource takes releaseTimestamp from
# Docker Hub's tag_last_pushed and from nowhere else -- the OCI distribution
# API exposes no publish time (renovatebot/renovate#39064, #38656), and
# distroless's reproducible builds zero the image timestamps anyway -- so
# the three-day gate cannot be enforced on these images and
# .github/renovate.json leaves them out of every automerge rule. They open
# with `age-gated` (renovate.json labels exactly this set, so `manual-merge`
# keeps meaning "a human has to act"), and the review a human did on them
# is already mechanical: `dockerfile-digests` and both `docker-smoke` legs
# are required via `ci-ok`. The click added nothing but the age check.
# This is the age check.
#
# The clock, preferred: the registry's upload time for every digest the PR
# adds. gcr.io's tags/list returns `timeUploadedMs` per manifest, stamped by
# the registry when the manifest was pushed, so a publisher (or an attacker
# holding its credentials) cannot backdate it. That is exactly the gate's
# threat model -- a compromised or broken release is usually pulled within
# days of going public -- and a rebase no longer restarts the wait, because
# a rebase does not change the image. Never `timeCreatedMs`: it comes from
# the image config, which the publisher writes, and distroless's
# reproducible builds set it to 0, which would read as fifty years old.
#
# The clock, fallback: the head commit's committer timestamp. "First time we
# saw this digest" is never earlier than its publish time, so 72h from
# first-seen is at least 72h from publish, conservatively. It is used for
# every PR the upload clock cannot vouch for: a ghcr.io image (no upload time
# in its API), a lookup that fails, a digest missing from the listing, or an
# upload time later than the commit that pins it. Failing closed means
# waiting longer, never merging sooner. PR created_at would NOT do as a
# clock: Renovate force-pushes the branch when the digest moves again, so an
# old PR can carry a minutes-old digest.
#
# Stalls. Either clock restarts when upstream publishes a newer digest, and
# Renovate always proposes the newest, so an image released more often than
# every 72h never merges on its own. A PR still waiting on age after
# STALL_DAYS gets one comment saying so, and keeps waiting: Renovate keeps
# it current, nothing is lost by waiting for a quiet week upstream, and the
# only thing a human could do instead is merge a digest younger than the
# gate allows, which is never the safe answer. (The stall used to hand the
# PR to a human with `manual-merge`; that asked a question whose answer was
# always "keep waiting".) A release that needs the newer base before then
# can still be cut by hand.
#
# Catch-up (#1152). Renovate force-pushes the PR to the newest digest on
# every upstream rebuild, so the digest it replaced is gone from the PR but
# not from the registry, and without this the gate forgot it even once it
# had aged. For a PR waiting only on age, the select job finds the newest
# digest the PR has ever pinned that a renovate[bot] commit introduced, is
# newer than what main pins, has aged MIN_AGE_HOURS by the registry upload
# time or by the GitHub-stamped time of the force-push that introduced it,
# is still served by its registry, and comes no sooner than MIN_AGE_HOURS
# after the last change to that image on main (one catch-up per image per
# age window, so a daily rebuild upstream does not mean a daily merge
# here). The open-catchup job then opens one PR per image on
# age-gate/<image>, authored by github-actions[bot] and labelled age-gated,
# with the same PAT the merge uses so ci-ok runs on it. The gate selects
# that PR like any other, aged by construction (its body records the
# clock and age the selection saw; a commit by anyone else refuses it),
# and merges it pinned to head once every check is green. A catch-up PR
# whose base line no longer matches main (anything else moved the image
# first) is closed, never merged: it would pin a digest older than main.
# Renovate then conflicts, rebases on its next run, and keeps proposing
# the newest digest with its upload clock intact; that PR may wear
# manual-merge for the hours until the rebase. The history is read from
# force-push timeline events and the commits they name, never from a
# comment the gate could have written: a comment is editable.
#
# Hourly, so an aged PR merges within the hour instead of waiting up to a day
# for the next run -- a day in which a newer digest can land and restart it.
#
# Built to be deleted. If upstream Renovate gains a registry-agnostic
# release timestamp (renovatebot/renovate#39064; the OCI `created` draft
# #43566 cannot cover distroless, which publishes epoch-0 `created`), scope
# these images back into the digest automerge rule in renovate.json and
# remove this workflow and its docs/CI.md section.
#
# The merge is the shared arm-auto-merge action, pinned to the head SHA the
# selection looked at. By the time this runs, every check finished long ago, so
# the PR is in "clean" status and the merge is immediate (the action's
# `merged-direct` outcome); the pin makes a push that lands in between fail
# the merge rather than ship unreviewed content. If the PR has stopped being
# clean in that window the action arms auto-merge instead, and the step
# after it disarms: an armed PR would merge whatever Renovate pushes next,
# unaged. Merged with MARKETPLACE_SMOKE_PAT, not the default token, so the
# push to main triggers main's push workflows (CI, docs, scout) as a human
# merge would -- a github-actions[bot] merge would not (recursion guard).
# Without the secret the merge job skips with a warning and the PRs stay
# where they were: open, labelled, waiting for a human.
#
# Red, conflicting, draft or hand-touched PRs are left alone and get
# `manual-merge` added (removed again once the PR is clean), so the "what
# needs me" query stays truthful; a PR with a check still running, or
# whose digest is still too young, is simply waited for. Selection covers
# Renovate's PRs (head renovate/*, every commit by renovate[bot]) and the
# gate's own catch-up PRs (head age-gate/*, every commit by
# github-actions[bot]); both carry age-gated. "Red" means any
# completed check on the head that is not a success or a skip, not only
# ci-ok: ci.yml's path filters leave ci-ok green with every job skipped on
# a change outside the paths it watches, and the check that does exercise
# such a change (the fuzz build on .clusterfuzzlite/, from cflite-pr.yml)
# is not a required check. The gate is about to merge on its own; it
# should not merge past a red check because that check was optional.
# Converting a PR to a draft is the hold lever. Everything else Renovate
# opens merges under renovate.json's own rules and is out of scope by
# selection: this touches only PRs that are all of (head renovate/* or
# age-gate/*, label age-gated, title "Update <image> Docker digest to
# <sha>", every commit by the bot that owns the branch).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: >-
          Report which PRs would merge and why the rest would not; merge
          nothing. The default for a manual run, so a dispatch is always
          safe to use as a probe.
        type: boolean
        default: true
  schedule:
    - cron: "23 * * * *"

permissions: {}

env:
  # Matches `minimumReleaseAge: "3 days"` on the Docker Hub digest rule in
  # .github/renovate.json; change both or neither.
  MIN_AGE_HOURS: "72"
  # An age-gated PR still waiting on age this long after it opened is
  # stalled (see "Stalls" above): it gets one comment and keeps waiting.
  STALL_DAYS: "7"

jobs:
  select:
    name: Select digest PRs that have aged 72h
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      # write: the step adds/removes `manual-merge` on candidates it refuses
      # for a non-age reason, comments once on a stalled one (reading the
      # PR's comments to post it only once), and closes a stale catch-up PR
      # of the gate's own. Labels, comments and closes only; it never
      # merges or pushes.
      pull-requests: write
    outputs:
      eligible: ${{ steps.catchup.outputs.eligible }}
      catchups: ${{ steps.catchup.outputs.catchups }}
    steps:
      - name: Evaluate every candidate PR
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          # Everything this gate could ever touch. renovate.json puts
          # `age-gated` on exactly the gcr.io/ghcr.io digest set (Docker Hub
          # digests automerge via Renovate and carry no label); the title
          # test below is the second guard.
          # Two calls, not one: asking `gh pr list` for commits and the check
          # rollup of 50 PRs at once exceeds GitHub's GraphQL node limit.
          gh pr list --state open --label age-gated --limit 50 \
            --json number --jq '.[].number' > numbers.txt
          while read -r n; do
            gh pr view "${n}" \
              --json number,title,createdAt,headRefName,headRefOid,isDraft,isCrossRepository,mergeStateStatus,commits,statusCheckRollup,labels
          done < numbers.txt | jq -s '.' > candidates.json
          # Upload clock: for each PR, the newest gcr.io upload time among the
          # digests its diff adds, or nothing if any one of them cannot be
          # vouched for (then the commit clock applies). The refs come from
          # the diff Renovate wrote; the regex admits only a registry path and
          # a 64-hex digest, and only gcr.io is ever queried.
          # refs_in_patch: the image refs a patch adds, one per line. The regex
          # admits only a registry path and a 64-hex digest.
          refs_in_patch() {
            grep -E '^[+]' \
              | grep -oE '[a-z0-9.-]+(/[a-z0-9._-]+)+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' \
              | sort -u || true
          }
          # upload_ms_refs: newest gcr.io upload time among the refs on stdin,
          # or nothing if any one of them cannot be vouched for. Only gcr.io is
          # ever queried.
          upload_ms_refs() {
            local refs ref path digest ms newest=0
            refs=$(cat)
            [ -n "${refs}" ] || return 0
            while read -r ref; do
              case "${ref}" in gcr.io/*) ;; *) return 0 ;; esac
              digest="${ref##*@}"
              path="${ref#gcr.io/}"
              path="${path%@*}"
              path="${path%%:*}"
              ms=$(curl --fail --silent --show-error --max-time 30 "https://gcr.io/v2/${path}/tags/list" \
                | jq -r --arg d "${digest}" '.manifest[$d].timeUploadedMs // empty | tonumber') || return 0
              [[ "${ms}" =~ ^[0-9]+$ ]] || return 0
              if [ "${ms}" -gt "${newest}" ]; then newest="${ms}"; fi
            done <<< "${refs}"
            echo "${newest}"
          }
          upload_ms() {
            gh api "repos/${GH_REPO}/pulls/${1}/files" --paginate --jq '.[].patch // empty' \
              | refs_in_patch | upload_ms_refs
          }
          while read -r n; do
            ms=$(upload_ms "${n}" || true)
            printf '{"number":%s,"uploaded_ms":%s}\n' "${n}" "${ms:-null}"
          done < numbers.txt | jq -s '.' > uploads.json
          # One row per PR: eligible or the first reason it is not. All
          # conditions are conjunctive; a PR has to be clean on every one.
          # Each refusal is also classed: `human` (red, conflict, draft, fork,
          # hand-touched) gets the manual-merge label below; `wait` (checks
          # still running, merge state not settled, not aged yet, stalled)
          # does not. A stall is a wait with one comment.
          jq -r --argjson now "${now}" --argjson min_hours "${MIN_AGE_HOURS}" --argjson stall_days "${STALL_DAYS}" \
            --slurpfile uploads uploads.json '
            ($uploads[0] | map({key: (.number | tostring), value: .uploaded_ms}) | from_entries) as $up
            | def head_commit: . as $pr | ($pr.commits[] | select(.oid == $pr.headRefOid)) // $pr.commits[-1];
            def committed: head_commit.committedDate | fromdateiso8601;
            # An upload time after the commit that pins the digest cannot be
            # right; distrust it and fall back to the commit.
            def uploaded: $up[.number | tostring] as $ms
              | if $ms != null and ($ms / 1000) <= committed then $ms / 1000 else null end;
            def catchup: .headRefName | startswith("age-gate/");
            def owner: if catchup then "github-actions[bot]" else "renovate[bot]" end;
            def clock: if catchup then "catch-up" elif uploaded != null then "upload" else "commit" end;
            def age_hours: (($now - (uploaded // committed)) / 3600 | floor);
            def age_text: if clock == "upload" then "head digest was uploaded \(age_hours)h ago" else "head commit is \(age_hours)h old" end;
            def open_days: (($now - (.createdAt | fromdateiso8601)) / 86400 | floor);
            # Every check on the head counts, not only ci-ok. The path filters
            # in ci.yml skip its jobs on a change outside src/, so ci-ok is
            # green on a builder-image PR while the workflow that builds the
            # fuzzers (cflite-pr.yml) is a separate, non-required check. A
            # completed check that is neither a success nor a skip refuses the
            # PR; one still running is waited for; ci-ok itself must be green.
            # The rollup carries check runs (status/conclusion) and commit
            # statuses (state); both shapes are read, told apart by which field
            # they carry rather than by __typename. No apostrophes here: the
            # program is a single-quoted shell string.
            def checks: [.statusCheckRollup[]?];
            def check_name: .name // .context // "?";
            def check_red:
              (.status != null and .status == "COMPLETED"
                and ((.conclusion | IN("SUCCESS", "SKIPPED", "NEUTRAL")) | not))
              or (.state != null and ((.state | IN("SUCCESS", "PENDING", "EXPECTED")) | not));
            def check_pending:
              (.status != null and .status != "COMPLETED")
              or (.state != null and (.state | IN("PENDING", "EXPECTED")));
            def red_checks: [checks[] | select(check_red) | check_name] | unique | join(", ");
            def ci_ok_green: checks | any(.name == "ci-ok" and .status == "COMPLETED" and .conclusion == "SUCCESS");
            def ci_state:
              if (checks | any(check_red)) then "red"
              elif (ci_ok_green | not) or (checks | any(check_pending)) then "running"
              else "green" end;
            def has_manual: [.labels[]?.name] | index("manual-merge") != null;
            def verdict:
              if ((.headRefName | startswith("renovate/")) or catchup) | not then ["human", "head branch is not renovate/* or age-gate/*"]
              elif (.title | test("^Update .+ Docker digest to [0-9a-f]+$")) | not then ["human", "title is not a Docker digest update"]
              elif .isDraft then ["human", "draft"]
              elif .isCrossRepository then ["human", "head is in a fork"]
              elif (owner as $o | [.commits[].authors[].login] | all(. == $o)) | not then ["human", "a commit is not authored by \(owner)"]
              elif ci_state == "red" then ["human", "a check failed on the head commit: \(red_checks)"]
              elif ci_state == "running" then ["wait", "a check has not completed on the head commit"]
              elif .mergeStateStatus == "DIRTY" then ["human", "merge state is DIRTY (conflict)"]
              elif .mergeStateStatus != "CLEAN" then ["wait", "merge state is \(.mergeStateStatus), not CLEAN"]
              elif catchup then ["eligible", "eligible (catch-up PR, aged when opened)"]
              elif age_hours < $min_hours and open_days >= $stall_days then ["wait", "stalled: open \(open_days)d and the \(age_text), needs \($min_hours)h"]
              elif age_hours < $min_hours then ["wait", "\(age_text), needs \($min_hours)h"]
              else ["eligible", "eligible"] end;
            .[] | verdict as $v | [.number, .headRefOid, (age_hours|tostring), .mergeStateStatus, $v[1], (has_manual|tostring), $v[0], .title, clock] | @tsv
          ' candidates.json > rows.tsv
          # Keep manual-merge truthful: on a PR a human has to act on, make
          # sure it is there; on one that is merely waiting, make sure it is
          # not. A stalled PR is waiting, and says so once. A dry run reports
          # and touches nothing.
          if [ "${DRY_RUN}" != "true" ]; then
            while IFS=$'\t' read -r n _ _ _ reason has_manual verdict _ _; do
              if [ "${verdict}" = "human" ] && [ "${has_manual}" = "false" ]; then
                gh pr edit "${n}" --add-label manual-merge || echo "::warning::could not add manual-merge to #${n}"
              elif [ "${verdict}" != "human" ] && [ "${has_manual}" = "true" ]; then
                gh pr edit "${n}" --remove-label manual-merge || echo "::warning::could not remove manual-merge from #${n}"
              fi
              # Once per PR: the comment is the marker, so a restarted clock
              # (a newer digest) does not post it again.
              if [[ "${reason}" == stalled:* ]]; then
                posted=$(gh pr view "${n}" --json comments --jq '[.comments[].body | select(startswith("Age gate stalled:"))] | length' || echo 1)
                if [ "${posted}" = "0" ]; then
                  gh pr comment "${n}" --body "Age gate stalled: ${reason#stalled: }. Upstream keeps publishing newer digests and Renovate keeps moving this PR to the newest, so it has not aged ${MIN_AGE_HOURS}h on its own. The gate keeps waiting and merges it by itself in the first quiet ${MIN_AGE_HOURS}h upstream; nothing is needed from a person. Merging it by hand would ship a digest younger than the gate allows. See \`digest-age-gate.yml\`." \
                    || echo "::warning::could not comment on stalled #${n}"
                fi
              fi
            done < rows.tsv
          fi
          {
            echo "### Age gate for gcr.io/ghcr.io digest PRs"
            if [ "${DRY_RUN}" = "true" ]; then echo ""; echo "**Dry run** -- nothing is merged."; fi
            echo ""
            if [ ! -s rows.tsv ]; then
              echo "No open age-gated PR from Renovate."
            else
              echo "| PR | age | clock | state | decision | class |"
              echo "|---|---|---|---|---|---|"
              awk -F'\t' '{printf "| #%s %s | %sh | %s | %s | %s | %s |\n", $1, $8, $3, $9, $4, $5, $7}' rows.tsv
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          cat rows.tsv
      - name: Catch-up candidates, stale catch-up PRs, final eligibility
        id: catchup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          # Stale catch-up PRs first. The gate's own PR removes one ref and
          # adds another; if the ref it removes is not what main pins now,
          # main moved and the PR must not merge.
          : > stale.txt
          while IFS=$'\t' read -r -u 3 n head; do
            file=$(gh api "repos/${GH_REPO}/pulls/${n}/files" --jq '.[0].filename')
            removed=$(gh api "repos/${GH_REPO}/pulls/${n}/files" --jq '.[].patch // empty' | grep -E '^[-]' \
              | grep -oE '[a-z0-9.-]+(/[a-z0-9._-]+)+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' | head -n 1 || true)
            image="${removed%%@*}"
            main_ref=$(gh api "repos/${GH_REPO}/contents/${file}" --jq '.content' | base64 -d \
              | grep -oE "${image}@sha256:[0-9a-f]{64}" | head -n 1 || true)
            if [ -z "${removed}" ] || [ "${removed}" != "${main_ref}" ]; then
              echo "${n}" >> stale.txt
              echo "::warning::catch-up #${n} is stale: main no longer pins the ref it replaces"
              if [ "${DRY_RUN}" != "true" ]; then
                gh pr close "${n}" --comment "Closing: main no longer pins the digest this catch-up replaces, so merging it would pin a digest older than main. The gate opens a fresh catch-up if one is still warranted. See \`digest-age-gate.yml\`." \
                  || echo "::warning::could not close stale catch-up #${n}"
              fi
            fi
          done 3< <(jq -r '.[] | select(.headRefName | startswith("age-gate/")) | [.number, .headRefOid] | @tsv' candidates.json)
          # Final eligibility: the selection's rows minus stale catch-ups.
          eligible=$(awk -F'\t' 'NR == FNR {stale[$1] = 1; next} $7 == "eligible" && !($1 in stale) {printf "%s{\"number\":%s,\"head\":\"%s\",\"clock\":\"%s\"}", (n++ ? "," : ""), $1, $2, $9}' stale.txt rows.tsv)
          echo "eligible=[${eligible}]" >> "${GITHUB_OUTPUT}"
          echo "eligible: [${eligible}]"
          # A PR waiting only on age may already have pinned a digest that
          # has aged: Renovate force-pushes the branch to the newest digest
          # on every upstream rebuild, and the one it replaced is gone from
          # the PR but not from the registry. This step finds, per such PR,
          # the newest digest the PR has ever pinned that (1) a renovate[bot]
          # commit introduced, (2) is newer than what main pins, (3) has aged
          # MIN_AGE_HOURS by the registry upload time or, failing that, by
          # the GitHub-stamped time of the force-push that introduced it,
          # (4) is still served by its registry, and (5) comes no sooner
          # than MIN_AGE_HOURS after the last change to that image on main.
          # It reports in the summary and hands the open-catchup job the
          # list, unless a catch-up PR for that image is already open and
          # pins the same digest. A catch-up PR whose base line no longer
          # matches main is stale (something else moved the image first):
          # it is closed here and dropped from the eligible list, because
          # merging it would pin a digest older than main (#1152).
          #
          # History comes from the force-push events (GraphQL, GitHub-stamped
          # createdAt, before/after commits), never from a comment the gate
          # could have written: a comment is editable, a timeline event is
          # not. The digest a before-commit pinned is read from that commit
          # itself, which GitHub keeps after a force-push.
          refs_in_patch() {
            grep -E '^[+]' \
              | grep -oE '[a-z0-9.-]+(/[a-z0-9._-]+)+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' \
              | sort -u || true
          }
          upload_ms_refs() {
            local refs ref path digest ms newest=0
            refs=$(cat)
            [ -n "${refs}" ] || return 0
            while read -r ref; do
              case "${ref}" in gcr.io/*) ;; *) return 0 ;; esac
              digest="${ref##*@}"
              path="${ref#gcr.io/}"
              path="${path%@*}"
              path="${path%%:*}"
              ms=$(curl --fail --silent --show-error --max-time 30 "https://gcr.io/v2/${path}/tags/list" \
                | jq -r --arg d "${digest}" '.manifest[$d].timeUploadedMs // empty | tonumber') || return 0
              [[ "${ms}" =~ ^[0-9]+$ ]] || return 0
              if [ "${ms}" -gt "${newest}" ]; then newest="${ms}"; fi
            done <<< "${refs}"
            echo "${newest}"
          }
          # present: does the registry still serve this manifest? gcr.io
          # answers a HEAD anonymously; ghcr.io wants an anonymous pull
          # token first. Any other registry, or any failure, is "no".
          present() {
            local ref="$1" host path digest token
            host="${ref%%/*}"
            path="${ref#*/}"; path="${path%@*}"; path="${path%%:*}"
            digest="${ref##*@}"
            local accept='Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
            case "${host}" in
              gcr.io)
                curl --fail --silent --output /dev/null --head --max-time 30 -H "${accept}" \
                  "https://gcr.io/v2/${path}/manifests/${digest}" ;;
              ghcr.io)
                token=$(curl --fail --silent --max-time 30 "https://ghcr.io/token?scope=repository:${path}:pull" | jq -r '.token // empty') || return 1
                [ -n "${token}" ] || return 1
                curl --fail --silent --output /dev/null --head --max-time 30 -H "${accept}" -H "Authorization: Bearer ${token}" \
                  "https://ghcr.io/v2/${path}/manifests/${digest}" ;;
              *) return 1 ;;
            esac
          }
          : > catchup.tsv
          : > catchups.jsonl
          # Only PRs the selection left waiting on age (or stalled) qualify.
          # fd 3 carries the PR list so nothing inside the loop can eat it.
          while IFS=$'\t' read -r -u 3 n head; do
            # The file the PR changes and the ref it currently pins.
            file=$(gh api "repos/${GH_REPO}/pulls/${n}/files" --jq '.[0].filename')
            current_ref=$(gh api "repos/${GH_REPO}/pulls/${n}/files" --jq '.[].patch // empty' | refs_in_patch | head -n 1)
            image="${current_ref%%@*}"
            # What main pins for this image right now.
            main_ref=$(gh api "repos/${GH_REPO}/contents/${file}" --jq '.content' | base64 -d \
              | grep -oE "${image}@sha256:[0-9a-f]{64}" | head -n 1 || true)
            # Force-push history, oldest first. Each before-commit is a head
            # the branch had; the digest it pinned was introduced by the
            # previous event (or by the PR itself for the first head).
            created=$(jq -r --argjson n "${n}" '.[] | select(.number == $n) | .createdAt' candidates.json)
            cat > history.graphql <<'GQL'
              query($owner: String!, $repo: String!, $n: Int!) {
                repository(owner: $owner, name: $repo) { pullRequest(number: $n) {
                  timelineItems(itemTypes: [HEAD_REF_FORCE_PUSHED_EVENT], first: 100) { nodes {
                    ... on HeadRefForcePushedEvent { createdAt beforeCommit { oid author { user { login } } } } } } } } }
          GQL
            cat > history.jq <<'JQ'
              [.data.repository.pullRequest.timelineItems.nodes[] | select(.beforeCommit != null)]
              | sort_by(.createdAt) | . as $ev | to_entries
              | map({oid: .value.beforeCommit.oid,
                     author: (.value.beforeCommit.author.user.login // ""),
                     introduced: (if .key == 0 then null else $ev[.key - 1].createdAt end)})
          JQ
            gh api graphql -F owner="${GH_REPO%%/*}" -F repo="${GH_REPO#*/}" -F n="${n}" -F query=@history.graphql \
              | jq -f history.jq > history.json
            # Walk newest first. A head whose digest equals the current one
            # (a plain rebase) or one main already pins is not a candidate;
            # anything introduced before the digest main pins is older than
            # main and skipped too.
            decision="" reason=""
            while read -r entry; do
              oid=$(jq -r '.oid' <<< "${entry}")
              author=$(jq -r '.author' <<< "${entry}")
              introduced=$(jq -r '.introduced // empty' <<< "${entry}")
              [ -n "${introduced}" ] || introduced="${created}"
              ref=$(gh api "repos/${GH_REPO}/commits/${oid}" --jq '.files[].patch // empty' 2>/dev/null | refs_in_patch | grep -F "${image}@" | head -n 1 || true)
              [ -n "${ref}" ] || continue
              [ "${ref}" != "${current_ref}" ] || continue
              if [ "${ref}" = "${main_ref}" ]; then break; fi
              if [ "${author}" != "renovate[bot]" ]; then decision="skip"; reason="head ${oid:0:7} is not authored by renovate[bot]"; break; fi
              seen=$(date -u -d "${introduced}" +%s)
              ms=$(upload_ms_refs <<< "${ref}" || true)
              if [ -n "${ms}" ] && [ "$((ms / 1000))" -le "${seen}" ]; then clock="upload"; since=$((ms / 1000)); else clock="first-seen"; since="${seen}"; fi
              age=$(( (now - since) / 3600 ))
              if [ "${age}" -lt "${MIN_AGE_HOURS}" ]; then continue; fi
              if ! present "${ref}"; then decision="skip"; reason="${ref##*@sha256:} aged ${age}h but the registry no longer serves it"; continue; fi
              # Spacing: the last change to this image on main.
              last=$(gh api "repos/${GH_REPO}/commits?path=${file}&per_page=20" --jq '.[].sha' | while read -r sha; do
                if gh api "repos/${GH_REPO}/commits/${sha}" --jq '.files[].patch // empty' | grep -qF "${image}@"; then
                  gh api "repos/${GH_REPO}/commits/${sha}" --jq '.commit.committer.date'; break; fi; done)
              gap=$(( (now - $(date -u -d "${last:-1970-01-01T00:00:00Z}" +%s)) / 3600 ))
              if [ "${gap}" -lt "${MIN_AGE_HOURS}" ]; then decision="wait"; reason="candidate ${ref##*@sha256:} aged ${age}h (${clock}) but main changed this image ${gap}h ago, spacing is ${MIN_AGE_HOURS}h"; break; fi
              # One branch per image. An open catch-up pinning this same ref
              # is left alone; one pinning something else is updated.
              slug=$(printf '%s' "${image}" | tr -c 'A-Za-z0-9.-' '-')
              open_n=$(gh pr list --state open --head "age-gate/${slug}" --json number --jq '.[0].number // empty')
              open_ref=""
              if [ -n "${open_n}" ]; then
                open_ref=$(gh api "repos/${GH_REPO}/pulls/${open_n}/files" --jq '.[].patch // empty' | refs_in_patch | grep -F "${image}@" | head -n 1 || true)
              fi
              if [ "${open_ref}" = "${ref}" ]; then decision="open-already"; reason="catch-up #${open_n} already pins ${ref##*@sha256:}"; break; fi
              decision="would-open"; reason="${ref} aged ${age}h (${clock}), present, main last changed ${gap}h ago"
              jq -nc --argjson source "${n}" --arg image "${image}" --arg ref "${ref}" --arg file "${file}" \
                --arg slug "${slug}" --arg clock "${clock}" --argjson age "${age}" \
                '{source: $source, image: $image, ref: $ref, file: $file, slug: $slug, clock: $clock, age: $age}' >> catchups.jsonl
              break
            done < <(jq -c 'reverse | .[]' history.json)
            [ -n "${decision}" ] || { decision="none"; reason="no earlier digest of this PR has aged ${MIN_AGE_HOURS}h"; }
            printf '%s\t%s\t%s\t%s\n' "${n}" "${decision}" "${reason}" "${head}" >> catchup.tsv
          done 3< <(awk -F'\t' '$7 == "wait" && ($5 ~ /needs [0-9]+h$/) {print $1 "\t" $2}' rows.tsv)
          catchups=$(jq -sc '.' catchups.jsonl)
          echo "catchups=${catchups}" >> "${GITHUB_OUTPUT}"
          echo "catchups: ${catchups}"
          {
            echo ""
            echo "#### Catch-up candidates"
            echo ""
            if [ ! -s catchup.tsv ]; then
              echo "No PR is waiting on age."
            else
              echo "| PR | decision | detail |"
              echo "|---|---|---|"
              awk -F'\t' '{printf "| #%s | %s | %s |\n", $1, $2, $3}' catchup.tsv
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          cat catchup.tsv

  open-catchup:
    name: "Catch-up for #${{ matrix.source }}"
    needs: select
    if: needs.select.outputs.catchups != '[]' && inputs.dry-run != true
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.catchups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Open or update the catch-up PR
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SMOKE_PAT }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ matrix.source }}
          IMAGE: ${{ matrix.image }}
          REF: ${{ matrix.ref }}
          FILE: ${{ matrix.file }}
          SLUG: ${{ matrix.slug }}
          CLOCK: ${{ matrix.clock }}
          AGE: ${{ matrix.age }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::MARKETPLACE_SMOKE_PAT is not configured -- no catch-up PR is opened (a GITHUB_TOKEN PR would get no CI)."
            exit 0
          fi
          # The matrix values came from the selection, which admits only a
          # registry path and a 64-hex digest; re-check before writing them.
          [[ "${REF}" =~ ^[a-z0-9.-]+(/[a-z0-9._-]+)+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}$ ]] || { echo "::error::refusing ref ${REF}"; exit 1; }
          [[ "${FILE}" =~ ^[A-Za-z0-9._/-]+$ && "${FILE}" != *..* ]] || { echo "::error::refusing path ${FILE}"; exit 1; }
          [[ "${SLUG}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::refusing slug ${SLUG}"; exit 1; }
          branch="age-gate/${SLUG}"
          digest="${REF##*@sha256:}"
          perl -pi -e 's/\Q$ENV{IMAGE}\E\@sha256:[0-9a-f]{64}/$ENV{REF}/' "${FILE}"
          if git diff --quiet -- "${FILE}"; then
            echo "::warning::${FILE} on main already pins ${REF}; nothing to open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "${branch}"
          git commit -q -am "Update ${IMAGE} Docker digest to ${digest:0:7}"
          gh auth setup-git
          git push --quiet --force origin "HEAD:refs/heads/${branch}"
          if [ "${CLOCK}" = "upload" ]; then
            why="the registry's own upload time put it at ${AGE}h when this PR was opened"
          else
            why="the GitHub-stamped force-push that first pinned it on #${SOURCE} was ${AGE}h ago when this PR was opened"
          fi
          body="Catch-up for #${SOURCE} (\`digest-age-gate.yml\`, [run](${RUN_URL})). Renovate has since moved that PR to a newer digest that has not aged yet; this one had, and the registry still serves it: ${why}. It is never younger than the ${MIN_AGE_HOURS}h gate allows. The gate merges this PR once every check is green, pinned to its head, and closes it instead if main moves this image first. #${SOURCE} stays open, rebases on Renovate's next run, and merges its newer digest when that ages in turn."
          title="Update ${IMAGE} Docker digest to ${digest:0:7}"
          existing=$(gh pr list --state open --head "${branch}" --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body "${body}"
            echo "- updated #${existing} to ${REF}" >> "${GITHUB_STEP_SUMMARY}"
          else
            url=$(gh pr create --base main --head "${branch}" --title "${title}" --body "${body}" --label age-gated)
            echo "- opened ${url} for ${REF}" >> "${GITHUB_STEP_SUMMARY}"
          fi

  merge:
    name: "Merge #${{ matrix.number }}"
    needs: select
    # `inputs.dry-run` is unset on a schedule, so `!= true` is live there and
    # only an explicit dispatch with the box ticked (the default) is a probe.
    if: needs.select.outputs.eligible != '[]' && inputs.dry-run != true
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      # Only what fetching the `$/` self-repository action takes. No
      # checkout: nothing from the PR head is ever on this runner.
      contents: read
    strategy:
      # One at a time: the merges are squashes onto main, and a failure on
      # one (GitHub rejecting the head pin, say) should be legible on its own.
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.eligible) }}
    steps:
      - name: Leave the audit trail on the PR
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SMOKE_PAT }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ matrix.number }}
          HEAD: ${{ matrix.head }}
          CLOCK: ${{ matrix.clock }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::MARKETPLACE_SMOKE_PAT is not configured -- #${PR} is eligible but is left for a human (a GITHUB_TOKEN merge would skip main's push workflows)."
            exit 0
          fi
          if [ "${CLOCK}" = "catch-up" ]; then
            why="it is the gate's own catch-up PR, opened for a digest that had already aged ${MIN_AGE_HOURS}h (the PR body records the clock)"
          elif [ "${CLOCK}" = "upload" ]; then
            why="every digest it pins was uploaded to gcr.io at least ${MIN_AGE_HOURS}h ago (the registry's own upload time)"
          else
            why="head commit \`${HEAD:0:7}\` has been unchanged for at least ${MIN_AGE_HOURS}h (first-seen is never earlier than publish)"
          fi
          gh pr comment "${PR}" --body "Age-gated merge: ${why}, so this is the same wait Docker Hub digests get from Renovate's \`minimumReleaseAge\`; \`ci-ok\` is green and the PR is clean. Merging it pinned to head \`${HEAD:0:7}\`; see \`digest-age-gate.yml\` ([run](${RUN_URL}))." \
            || echo "::warning::could not comment on #${PR}; merging anyway"
      - name: Merge, pinned to the head the selection saw
        id: arm
        uses: $/.github/actions/arm-auto-merge
        with:
          pull-request: ${{ matrix.number }}
          token: ${{ secrets.MARKETPLACE_SMOKE_PAT }}
          expected-head: ${{ matrix.head }}
          note: It is eligible for the age gate; merge it by hand or wait for the next hourly run.
      - name: Record the outcome (and disarm if it only armed)
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SMOKE_PAT }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ steps.arm.outputs.result }}
          PR: ${{ matrix.number }}
        run: |
          echo "- #${PR}: \`${RESULT}\`" >> "${GITHUB_STEP_SUMMARY}"
          case "${RESULT}" in
            merged-direct) ;;
            armed|already-armed)
              # The PR was CLEAN at selection and is not any more (a check
              # re-run, say), so the action armed rather than merged. Arming
              # is wrong for this gate: GitHub keeps auto-merge armed across
              # pushes by a collaborator, so a newer digest Renovate pushes
              # onto the branch would merge the moment it went green, with
              # no 72h behind it. Disarm; the next hourly run re-evaluates.
              gh pr merge "${PR}" --disable-auto \
                || echo "::error::could not disarm auto-merge on #${PR} -- disarm it by hand (Disable auto-merge on the PR) or its next push merges unaged"
              echo "::warning::#${PR} was no longer clean when the merge ran; auto-merge was armed and has been disarmed again. It is re-evaluated on the next hourly run." ;;
            *)
              echo "::warning::#${PR} did not merge (${RESULT}); it stays open, age-gated, and is re-evaluated on the next hourly run." ;;
          esac

  # Scheduled runs have no PR to go red on. Without this the only signal
  # for a broken gate is an email to the workflow author -- and a silently
  # broken gate reads as "those PRs just have not aged yet".
  report-failure:
    name: Report scheduled failure
    needs:
      - select
      - open-catchup
      - merge
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: $/.github/actions/report-scheduled-failure
        with:
          note: The gcr.io/ghcr.io digest PRs were not evaluated; they wait for a human until the next green run.
