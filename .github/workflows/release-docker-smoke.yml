name: Release Docker smoke

# The functional smoke publish.yml runs against the image before it ships.
#
# It was extracted when a second, manual publish workflow carried its own
# copy, and that copy had become the weaker one: publish.yml asserted the
# container emits valid SARIF and the manual path did not, so the escape hatch
# shipped an image against a smaller definition of "works" than the normal
# path — the same shape of drift verify-tag.yml was extracted to stop, and the
# same one #624 found in the fixtures. That workflow is gone (the republish
# path is now publish.yml's own workflow_dispatch), but the battery stays in
# one file, pinned by tests/test_release_layer.py.
#
# Vulnerability scanning is deliberately not here. Scout answers a different
# question (does the image carry a critical CVE) and needs `security-events:
# write` to upload its SARIF, so it stays a publish.yml job rather than
# forcing this workflow to grant that permission.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag under test (e.g. v1.2.3)"
        required: true
        type: string
      matrix:
        description: >-
          JSON strategy matrix, e.g.
          {"include":[{"platform":"linux/amd64","runner":"ubuntu-24.04"}]}.
          publish.yml smokes both shipped arches.
        required: true
        type: string

permissions: {}

jobs:
  docker-smoke:
    name: Smoke ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag under release. verify-tag already requires the run to be
          # on that tag, so this matches the default; naming it keeps the
          # smoke tied to the input rather than to whatever ref started it.
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: composelint/compose-lint:release-smoke

      # Every step below uses the fully-hardened flag set documented in
      # README.md ("Running with full hardening"). If a user copy-pastes that
      # recipe and it breaks, this smoke fails the release. Keep these flags
      # in sync with README.md — both should change together.
      - name: Test — version output matches tag (hardened)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          expected="compose-lint ${TAG#v}"
          actual="$(docker run --rm \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --network none \
            --user 65532:65532 \
            --pids-limit 256 \
            composelint/compose-lint:release-smoke --version)"
          echo "Expected: ${expected}"
          echo "Actual:   ${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Version mismatch: image reports '${actual}', expected '${expected}'"
            exit 1
          fi
      - name: Test — clean fixture exits 0 (hardened)
        run: |
          docker run --rm \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --network none \
            --user 65532:65532 \
            --pids-limit 256 \
            -v "${PWD}/tests/smoke/clean.yml:/src/docker-compose.yml:ro" \
            composelint/compose-lint:release-smoke
      - name: Test — insecure fixture exits 1 (hardened)
        run: |
          exit_code=0
          docker run --rm \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --network none \
            --user 65532:65532 \
            --pids-limit 256 \
            -v "${PWD}/tests/smoke/insecure.yml:/src/docker-compose.yml:ro" \
            composelint/compose-lint:release-smoke || exit_code=$?
          if [ "${exit_code}" -ne 1 ]; then
            echo "::error::Expected exit code 1, got ${exit_code}"
            exit 1
          fi
      - name: Test — SARIF output is valid JSON (hardened)
        run: |
          docker run --rm \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --network none \
            --user 65532:65532 \
            --pids-limit 256 \
            -v "${PWD}/tests/smoke/sarif-shape.yml:/src/docker-compose.yml:ro" \
            composelint/compose-lint:release-smoke --format sarif --fail-on critical \
            | python3 -c "import sys, json; json.load(sys.stdin); print('Valid SARIF JSON')"
