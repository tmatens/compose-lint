# Build and deploy the docs site (issue #470). The site is a pure build
# artifact of docs/*.md via mkdocs.yml — content lives only in docs/.
# PRs touching the docs build (no deploy) so breakage surfaces pre-merge.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - mkdocs.yml
      # The hooks mkdocs.yml loads: they shape the built HTML and sitemap, so
      # editing one has to rebuild the site the same as editing a page does.
      - "scripts/mkdocs_*_hook.py"
      - requirements-docs.lock
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - "docs/**"
      - mkdocs.yml
      # The hooks mkdocs.yml loads: they shape the built HTML and sitemap, so
      # editing one has to rebuild the site the same as editing a page does.
      - "scripts/mkdocs_*_hook.py"
      - requirements-docs.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sitemap <lastmod> is the last commit date of each page's source
          # (scripts/mkdocs_git_dates_hook.py). The default depth-1 checkout
          # dates every page to the tip commit, so the hook detects the
          # shallow clone and falls back rather than publishing a fake date.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install docs toolchain (hash-pinned)
        run: pip install --require-hashes -r requirements-docs.lock
      - name: Build site
        run: mkdocs build --site-dir _site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
