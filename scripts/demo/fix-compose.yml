services:
  api:
    image: ghcr.io/acme/api:2.4.0
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
    ports:
      - "8080:8080"
    cap_drop:
      - ALL
    security_opt:
      - seccomp:unconfined
    environment:
      DATABASE_URL: postgres://db:5432/acme
    volumes:
      - ./config:/etc/acme:ro
