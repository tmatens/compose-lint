name: "compose-lint"
description: "Docker Compose security linter — OWASP/CIS-grounded rules, SARIF to GitHub Code Scanning, dry-run auto-fix"
branding:
  icon: "shield"
  color: "blue"

inputs:
  files:
    description: >-
      Compose files to lint: one path per line, or a single line of paths
      separated by spaces. A path that contains a space needs the one-per-line
      form, so use that for a list of changed files. Each entry is a literal
      path, not a glob: `*` and `?` are passed through unexpanded. Use
      `pattern` for globs. Every entry must be inside the workspace.
    required: false
    default: ""
  pattern:
    description: >-
      Glob matched against the file NAME (e.g., 'docker-compose*.yml'),
      searched recursively under the checkout. It cannot contain '/' — use
      `files` for paths.
    required: false
    default: ""
  fail-on:
    description: "Minimum severity to trigger failure (low, medium, high, critical)"
    required: false
    default: "high"
  config:
    description: "Path to .compose-lint.yml config file"
    required: false
    default: ""
  skip-suppressed:
    description: "Hide suppressed findings from output"
    required: false
    default: "false"
  allow-partial-coverage:
    description: >-
      Pass `--allow-partial-coverage`: downgrade a coverage gap (part of
      the stack that could not be linted, such as an `include:` that could
      not be followed or a `.env` that could not be read) from exit 2 to a
      warning. Every gap is listed in docs/compatibility.md.
    required: false
    default: "false"
  strict-config:
    description: >-
      Pass `--strict-config`: promote config-file warnings (unknown rule id,
      unknown key, an inert `reason:` or `severity:`, a stale
      `exclude_services` name, both config spellings present) to a hard
      error.
    required: false
    default: "false"
  quiet:
    description: >-
      Text output: one line per finding (no fix block or excerpt). Mutually
      exclusive with `verbose`; setting both fails the job before linting.
    required: false
    default: "false"
  verbose:
    description: >-
      Text output: repeat the fix block and reference on every finding.
      Mutually exclusive with `quiet`; setting both fails the job before
      linting.
    required: false
    default: "false"
  sarif-file:
    description: >-
      Path to write SARIF output (enables GitHub Code Scanning upload). Must
      stay inside the workspace; a parent directory that does not exist yet
      is created. A path where a directory, a symbolic link or another
      non-regular file already exists is refused.
    required: false
    default: ""
  version:
    description: >-
      compose-lint version to install. Defaults to the version this action was
      released with, installed with the dependency versions locked at that
      release (requirements.lock), so a SHA-pinned `uses:` gets a reproducible
      check. Set to "latest" to track PyPI instead; an explicit version or
      "latest" resolves its dependencies from PyPI.
    required: false
    default: ""
  allow-no-files:
    description: >-
      Succeed when no Compose files are found instead of failing. Off by
      default: a pattern that matches nothing is a misconfiguration, and the
      CLI itself exits 2 in that case.
    required: false
    default: "false"
  upload-sarif:
    description: >-
      Upload the written SARIF file to GitHub Code Scanning. Set to "false"
      to only write the file — for runners without Code Scanning (Forgejo)
      or jobs that lack the `security-events: write` permission the upload
      needs.
    required: false
    default: "true"

outputs:
  sarif-written:
    description: >-
      "true" when this run wrote the file requested via `sarif-file`, as a
      non-empty regular file at that path; empty otherwise.
    value: ${{ steps.lint.outputs.sarif-written }}

runs:
  using: "composite"
  steps:
    # User-controlled inputs are passed via the `env:` block rather than
    # interpolated directly into the `run:` script. Direct ${{ }} expansion
    # in shell bodies is a script-injection sink — see
    # https://securitylab.github.com/research/github-actions-untrusted-input/
    - name: Install compose-lint
      shell: bash
      env:
        CL_VERSION: ${{ inputs.version }}
      run: |
        # Pinned by default. A consumer who SHA-pins `uses:` is asking for a
        # reproducible check, and installing whatever PyPI serves at that
        # moment silently defeats that: the pinned ref selects this file, not
        # the package it installs. Release automation keeps DEFAULT_VERSION in
        # step with the release, and CI's "Version strings in sync" job fails
        # if it drifts.
        DEFAULT_VERSION="1.5.0"
        LOCK=""
        if [ -z "$CL_VERSION" ]; then
          SPEC="compose-lint==${DEFAULT_VERSION}"
          # Its dependencies are pinned too. Pinning compose-lint alone left
          # PyYAML to resolve fresh on every run, so a SHA-pinned `uses:` was
          # not the reproducible check it promises, and a new PyYAML release
          # reached every run the day it was uploaded. requirements.lock ships
          # in this action at every tag and is the hash-locked set that release
          # was tested with; Renovate moves it, after its age gate and CI.
          # An explicit `version:` may need other dependencies, so it
          # resolves them as before.
          LOCK="${GITHUB_ACTION_PATH}/requirements.lock"
        elif [ "$CL_VERSION" = "latest" ]; then
          # Opt-in to tracking PyPI. Used by this repo's own smoke jobs, which
          # exist to catch drift between the source action and the published
          # package.
          SPEC="compose-lint"
        else
          SPEC="compose-lint==${CL_VERSION}"
        fi

        # PyPI's JSON API sees a release within seconds of the publish, but the
        # /simple/ index pip resolves against can lag it by minutes. That race
        # is not hypothetical here: it failed this repo's own marketplace-smoke
        # minutes after the 0.20.0 publish (#612), and publish.yml's
        # testpypi-smoke has carried the same backoff since 0.3.6 for the same
        # reason on TestPyPI.
        #
        # A consumer hits it the moment they pin a just-released version — the
        # pinned-by-default behaviour above makes that the normal case, not an
        # edge one — so the retry belongs in the action rather than only in our
        # workflow. The cost is that a genuinely wrong version now takes ~100s
        # to fail instead of failing at once; the final message names both
        # possibilities so that wait is not a mystery.
        if [ -n "$LOCK" ]; then
          if ! pip install --require-hashes --no-deps -r "$LOCK"; then
            echo "::error::Could not install this action's locked dependencies from ${LOCK}."
            exit 1
          fi
        fi
        for attempt in 1 2 3 4 5 6; do
          if pip install ${LOCK:+--no-deps} "$SPEC"; then
            exit 0
          fi
          if [ "$attempt" = 6 ]; then
            echo "::error::Could not install '${SPEC}' after 6 attempts over ~100s. Either the version does not exist, or it was released moments ago and PyPI's /simple/ index has not propagated yet."
            exit 1
          fi
          echo "Attempt ${attempt} failed; sleeping 20s for PyPI /simple/ index propagation..."
          sleep 20
        done

    - name: Find Compose files
      id: find-files
      shell: bash
      env:
        CL_FILES: ${{ inputs.files }}
        CL_PATTERN: ${{ inputs.pattern }}
      run: |
        # The discovered paths are written NUL-separated to a file under
        # RUNNER_TEMP and only the *path to that file* crosses the step
        # boundary. $GITHUB_OUTPUT is a line-oriented text file, so putting
        # filenames in it let a path containing a newline forge output records
        # — `files=` could be terminated early and arbitrary step outputs
        # appended. Nothing attacker-controlled goes into $GITHUB_OUTPUT now.
        LIST_FILE="${RUNNER_TEMP:-/tmp}/compose-lint-files"
        : > "$LIST_FILE"
        COUNT=0

        if [ -n "$CL_FILES" ]; then
          # Every entry must stay inside the workspace. A list of changed
          # files is content the pull request chose, and splitting it on
          # spaces can turn one committed path into several entries, one of
          # them an absolute path the pull request never held. The CLI reads a
          # plain path wherever it points, so the check belongs here, where
          # the list arrives. It is physical: the entry's directory is
          # resolved with `pwd -P`, so a committed directory link leading out
          # of the workspace is refused as well. A final component that is a
          # link is left to the CLI, which refuses one that leaves the
          # repository. An entry whose directory does not exist is passed on
          # for the CLI to report as not found: there is nothing there to read.
          #
          # This step runs outside the lint step's stop-commands window, so an
          # entry is never echoed: the error names its position in the list.
          WORKSPACE="$(cd "${GITHUB_WORKSPACE:-$PWD}" && pwd -P)"
          add_entry() {
            local entry="$1" dir
            [ -n "$entry" ] || return 0
            COUNT=$((COUNT + 1))
            if dir="$(cd -- "$(dirname -- "$entry")" 2>/dev/null && pwd -P)"; then
              case "$dir/" in
                "$WORKSPACE"/*) ;;
                *)
                  echo "::error::files: entry $COUNT is outside the workspace. Every entry must be a path inside the checkout; a path that contains a space is split into separate entries unless the list is newline-separated."
                  exit 2
                  ;;
              esac
            fi
            printf '%s\0' "$entry" >> "$LIST_FILE"
          }
          case "$CL_FILES" in
            *$'\n'*)
              # One path per line. This is the form that can carry a path
              # containing a space, so it is the one to use for a list of
              # changed files. A trailing carriage return is dropped so a
              # CRLF list reads the same.
              while IFS= read -r entry || [ -n "$entry" ]; do
                add_entry "${entry%$'\r'}"
              done <<< "$CL_FILES"
              ;;
            *)
              # One line: entries are separated by spaces or tabs. Without
              # `set -f` the unquoted expansion also ran pathname expansion,
              # so `*.yml` quietly became whatever matched in the checkout (or
              # stayed literal when nothing did) — an undocumented second
              # discovery mechanism. `pattern` is the input for globs.
              set -f
              for entry in $CL_FILES; do
                add_entry "$entry"
              done
              set +f
              ;;
          esac
        elif [ -n "$CL_PATTERN" ]; then
          # -name matches the file NAME, so a slash can never match: the
          # documented example used to be `**/docker-compose*.yml`, which
          # found nothing and failed the job as "No Compose files found".
          # Refuse the shape loudly instead.
          case "$CL_PATTERN" in
            */*)
              echo "::error::pattern matches file names only and cannot contain '/': use files: for paths"
              exit 2
              ;;
          esac
          # -name takes a literal glob; we never eval the pattern as shell.
          # -print0 keeps paths intact through newlines and spaces, which the
          # previous `tr '\n' ' '` join destroyed.
          # find names an unreadable directory in its error message, and this
          # step runs outside the lint step's stop-commands window, so a
          # directory name could read as a workflow command. The walk is
          # bracketed the same way, with a token of its own.
          FIND_TOKEN="$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::${FIND_TOKEN}"
          while IFS= read -r -d '' f; do
            printf '%s\0' "$f" >> "$LIST_FILE"
            COUNT=$((COUNT + 1))
          done < <(find . -path "./.git" -prune -o -name "$CL_PATTERN" -print0)
          echo "::${FIND_TOKEN}::"
        else
          # Default: common Compose file names in repo root
          for f in docker-compose.yml docker-compose.yaml compose.yml compose.yaml; do
            if [ -f "$f" ]; then
              printf '%s\0' "$f" >> "$LIST_FILE"
              COUNT=$((COUNT + 1))
            fi
          done
        fi

        echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "list-file=$LIST_FILE" >> "$GITHUB_OUTPUT"

    - name: Run compose-lint
      id: lint
      shell: bash
      env:
        CL_CONFIG: ${{ inputs.config }}
        CL_FAIL_ON: ${{ inputs.fail-on }}
        CL_SKIP_SUPPRESSED: ${{ inputs.skip-suppressed }}
        CL_ALLOW_PARTIAL_COVERAGE: ${{ inputs.allow-partial-coverage }}
        CL_STRICT_CONFIG: ${{ inputs.strict-config }}
        CL_QUIET: ${{ inputs.quiet }}
        CL_VERBOSE: ${{ inputs.verbose }}
        CL_SARIF_FILE: ${{ inputs.sarif-file }}
        CL_ALLOW_NO_FILES: ${{ inputs.allow-no-files }}
        CL_COUNT: ${{ steps.find-files.outputs.count }}
        CL_LIST_FILE: ${{ steps.find-files.outputs.list-file }}
      run: |
        # "Nothing to lint" is not a pass. The CLI exits 2 when it finds no
        # Compose files, and this step used to be skipped entirely by an
        # `if:` condition — turning that fail-closed answer into a green
        # check. A pattern that matches nothing is a misconfiguration, and a
        # gate that reports success over an unlinted repository is the one
        # outcome this tool must never produce.
        if [ "${CL_COUNT:-0}" -eq 0 ]; then
          if [ "$CL_ALLOW_NO_FILES" = "true" ]; then
            echo "::warning::No Compose files found; allow-no-files is set"
            exit 0
          fi
          echo "::error::No Compose files found. Checked the 'files' and 'pattern' inputs and the repository root. Set allow-no-files: true if an empty result is expected."
          exit 2
        fi

        # The CLI's argparse group makes these mutually exclusive, and its
        # bare usage error carries no `::error` annotation and exits 2 — the
        # same code as a coverage gap. Refuse the combination here, in words.
        if [ "$CL_QUIET" = "true" ] && [ "$CL_VERBOSE" = "true" ]; then
          echo "::error::quiet and verbose are mutually exclusive"
          exit 2
        fi

        # compose-lint prints text taken from the Compose files it grades
        # (service names, env keys, source lines), and the runner treats text
        # in a step's output as workflow commands: `##[...]` anywhere in a
        # line, `::cmd::` at its start. A file in a pull request could forge
        # annotations, fold the verdict out of sight, or reach the deprecated
        # `set-output`. `stop-commands` with a fresh, unguessable token turns
        # command processing off; it is GitHub's documented control for
        # printing untrusted text. It does not turn off problem matchers
        # registered earlier in the job, which still read the output
        # (docs/github-action.md).
        #
        # Processing goes off here and stays off to the end of the step. It
        # used to come back on between the two compose-lint runs and after
        # the second, and the shell around them (mkdir, mv) printed errors
        # that quote a resolved path, in which a committed symlink puts a
        # directory name the pull request chose. So nothing below prints
        # outside the window except `finish`, and what `finish` prints after
        # closing it is a fixed string plus the `sarif-file` input as the
        # workflow author wrote it: never a resolved path, never a tool's own
        # error text.
        STOP_TOKEN="$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')"
        WINDOW_OPEN=false
        SARIF_WRITTEN=false
        close_window() {
          if [ "$WINDOW_OPEN" = "true" ]; then
            WINDOW_OPEN=false
            echo "::${STOP_TOKEN}::"
          fi
        }
        # An unexpected failure under `set -e` must not leave processing off
        # for the steps after this one.
        trap close_window EXIT
        # finish EXIT_CODE [MESSAGE]: the only way out of the window.
        finish() {
          close_window
          if [ -n "${2:-}" ]; then
            echo "::error::$2"
          fi
          if [ "$SARIF_WRITTEN" = "true" ]; then
            echo "sarif-written=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$1"
        }
        # One stream from here on. The runner reads stdout and stderr through
        # separate pipes, so a diagnostic on stderr could otherwise be read
        # after the line on stdout that closes the window.
        exec 2>&1
        echo "::stop-commands::${STOP_TOKEN}"
        WINDOW_OPEN=true

        mapfile -d '' -t TARGET_FILES < "$CL_LIST_FILE"

        ARGS=()
        if [ -n "$CL_CONFIG" ]; then
          ARGS+=(--config "$CL_CONFIG")
        fi
        ARGS+=(--fail-on "$CL_FAIL_ON")
        if [ "$CL_SKIP_SUPPRESSED" = "true" ]; then
          ARGS+=(--skip-suppressed)
        fi
        if [ "$CL_ALLOW_PARTIAL_COVERAGE" = "true" ]; then
          ARGS+=(--allow-partial-coverage)
        fi
        if [ "$CL_STRICT_CONFIG" = "true" ]; then
          ARGS+=(--strict-config)
        fi
        if [ "$CL_QUIET" = "true" ]; then
          ARGS+=(--quiet)
        fi
        if [ "$CL_VERBOSE" = "true" ]; then
          ARGS+=(--verbose)
        fi
        # The `version` input can install a release that predates a flag, and
        # passing it there would fail the job with a usage error. So each
        # newer flag is probed for rather than assumed.
        CHECK_HELP="$(compose-lint check --help 2>/dev/null || true)"
        # A suppression's `expires:` date is judged against the UTC date
        # (ADR-041), and this step runs compose-lint twice. Fixing the day
        # once keeps the two runs on the same side of midnight, so the SARIF
        # file never disagrees with the verdict.
        case "$CHECK_HELP" in
          *"--as-of"*) ARGS+=(--as-of "$(date -u +%Y-%m-%d)") ;;
        esac
        # `check --output` writes the report itself: one atomic write that
        # never follows what is at the path (compose-lint 1.4.0 and later).
        HAS_OUTPUT=false
        case "$CHECK_HELP" in
          *"--output PATH"*) HAS_OUTPUT=true ;;
        esac

        # `--` terminates the option namespace, so a repository file named
        # `--config=evil/compose.yml` arrives as a path instead of installing
        # an attacker-authored policy.
        TEXT_EXIT=0
        compose-lint "${ARGS[@]}" -- "${TARGET_FILES[@]}" || TEXT_EXIT=$?

        if [ -z "$CL_SARIF_FILE" ]; then
          finish "$TEXT_EXIT"
        fi

        # A SARIF artifact is requested, so re-run in SARIF mode. The first
        # run printed human-readable output to the job log and set the exit
        # code; this run only writes the file. Rules are deterministic, so the
        # two runs report the same findings.
        #
        # Keep the write target inside the workspace. An unvalidated path let
        # a caller-supplied value destroy a file anywhere the runner could
        # write, including outside the checkout, whether or not the lint
        # itself succeeded.
        WORKSPACE="$(cd "${GITHUB_WORKSPACE:-$PWD}" && pwd -P)"
        # The parent directory need not exist yet, but it is created only
        # after the containment check below has passed. That check needs a
        # physical path, so resolve the nearest existing ancestor with
        # `pwd -P` and carry the not-yet-existing tail lexically. A `..`
        # in that tail is refused: it would climb back out of whatever the
        # check approved once the directories exist.
        SARIF_PARENT="$(dirname -- "$CL_SARIF_FILE")"
        SARIF_TAIL=""
        while [ ! -d "$SARIF_PARENT" ]; do
          SEGMENT="$(basename -- "$SARIF_PARENT")"
          case "$SEGMENT" in
            ..)
              finish 2 "sarif-file: a directory that does not exist yet cannot contain '..': $CL_SARIF_FILE"
              ;;
            .) ;;
            *) SARIF_TAIL="${SEGMENT}/${SARIF_TAIL}" ;;
          esac
          SARIF_NEXT="$(dirname -- "$SARIF_PARENT")"
          if [ "$SARIF_NEXT" = "$SARIF_PARENT" ]; then
            finish 2 "sarif-file directory cannot be created: $CL_SARIF_FILE"
          fi
          SARIF_PARENT="$SARIF_NEXT"
        done
        SARIF_DIR="$(cd -- "$SARIF_PARENT" 2>/dev/null && pwd -P)" ||
          finish 2 "sarif-file directory cannot be entered: $CL_SARIF_FILE"
        if [ -n "$SARIF_TAIL" ]; then
          SARIF_DIR="$SARIF_DIR/${SARIF_TAIL%/}"
        fi
        SARIF_PATH="$SARIF_DIR/$(basename -- "$CL_SARIF_FILE")"
        case "$SARIF_PATH" in
          "$WORKSPACE"/*) ;;
          *)
            finish 2 "sarif-file must be inside the workspace"
            ;;
        esac
        mkdir -p -- "$SARIF_DIR" 2>/dev/null ||
          finish 2 "sarif-file directory could not be created: $CL_SARIF_FILE"

        # The containment check covers the directory. What is already AT the
        # path is the checkout's too, and a pull request can commit a
        # directory or a symlink there. A file moved "to" a directory lands
        # inside it, beside whatever `*.sarif` the pull request put there, and
        # the upload step takes every `*.sarif` in a directory it is given; a
        # symlink sends the write wherever it points. Neither is written to.
        sarif_is_regular() {
          [ ! -L "$SARIF_PATH" ] && [ -f "$SARIF_PATH" ]
        }
        if [ -L "$SARIF_PATH" ] || { [ -e "$SARIF_PATH" ] && [ ! -f "$SARIF_PATH" ]; }; then
          finish 2 "sarif-file exists and is a directory, a symbolic link or another non-regular file; it is not written to: $CL_SARIF_FILE"
        fi
        # The file's inode, empty when there is none. A file already at the
        # path may be one the pull request committed, so "a file is there
        # afterwards" does not show this run wrote it; a new inode does.
        sarif_inode() {
          local listing=""
          if sarif_is_regular; then
            listing="$(ls -di -- "$SARIF_PATH" 2>/dev/null)" || listing=""
          fi
          local inode=""
          read -r inode _ <<< "$listing" || true
          printf '%s' "$inode"
        }

        SARIF_EXIT=0
        if [ "$HAS_OUTPUT" = "true" ]; then
          INODE_BEFORE="$(sarif_inode)"
          # `--output=` keeps a value that begins with `-` attached to its
          # option. The path is passed as written so compose-lint's own
          # refusals name the input, not a resolved path.
          compose-lint --format sarif --output="$CL_SARIF_FILE" "${ARGS[@]}" \
            -- "${TARGET_FILES[@]}" || SARIF_EXIT=$?
          INODE_AFTER="$(sarif_inode)"
          if [ -z "$INODE_AFTER" ] || [ "$INODE_AFTER" = "$INODE_BEFORE" ]; then
            if [ "$SARIF_EXIT" -eq 0 ]; then SARIF_EXIT=1; fi
            finish "$SARIF_EXIT" "compose-lint did not write the SARIF file (exit ${SARIF_EXIT}); its reason is in the log above: $CL_SARIF_FILE"
          fi
        else
          # A release without `--output`. Write to a temporary file and move
          # it into place only once it holds a complete document. Redirecting
          # straight at the target truncated it first, so a failed run left a
          # 0-byte artifact, and `|| true` reported that as success, so the
          # upload shipped an empty result set as if the scan had been clean.
          SARIF_TMP="$(mktemp "${RUNNER_TEMP:-/tmp}/compose-lint-sarif.XXXXXX")"
          compose-lint --format sarif "${ARGS[@]}" -- "${TARGET_FILES[@]}" \
            > "$SARIF_TMP" || SARIF_EXIT=$?
          if [ ! -s "$SARIF_TMP" ]; then
            rm -f -- "$SARIF_TMP"
            if [ "$SARIF_EXIT" -eq 0 ]; then SARIF_EXIT=1; fi
            finish "$SARIF_EXIT" "compose-lint produced no SARIF output (exit ${SARIF_EXIT}); refusing to upload an empty artifact"
          fi
          # `-T` (GNU) treats the destination as a file whatever it is, so
          # the move can never land inside a directory. mv's own error quotes
          # the resolved path and is discarded.
          MV_ARGS=(-f)
          if mv --version >/dev/null 2>&1; then
            MV_ARGS+=(-T)
          fi
          if ! mv "${MV_ARGS[@]}" -- "$SARIF_TMP" "$SARIF_PATH" 2>/dev/null; then
            rm -f -- "$SARIF_TMP"
            finish 2 "sarif-file could not be written: $CL_SARIF_FILE"
          fi
        fi

        # `sarif-written` is what the upload is gated on, so it says only
        # what is true: a non-empty regular file is at exactly that path.
        if ! sarif_is_regular || [ ! -s "$SARIF_PATH" ]; then
          finish 2 "sarif-file was not written as a regular file: $CL_SARIF_FILE"
        fi
        SARIF_WRITTEN=true
        finish "$TEXT_EXIT"

    - name: Upload SARIF
      # Gated on the file actually having been written, not on `always()`.
      # `always()` uploaded whatever was at the path even when the lint step
      # had failed before producing a document.
      if: inputs.sarif-file != '' && inputs.upload-sarif == 'true' && !cancelled() && steps.lint.outputs.sarif-written == 'true'
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: ${{ inputs.sarif-file }}
